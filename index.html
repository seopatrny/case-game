    }
    st.innerHTML = `${contextBlock(q)}
      <div class="${q.big ? "lingo-q" : "qtitle"}">${q.big ? esc(q.title) : q.title}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fbslot"></div>`;
    st.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMCQ(+b.dataset.i)));
  } else if (q.type === "num") {
    const label = q.reask ? `<span class="eyebrow again">Again · you missed this one</span>` : q.label && S.mode !== "m:" + q.c && !S.bosses ? `<span class="eyebrow" style="text-align:center">${esc(q.label)}</span>` : "";
    st.innerHTML = `${S.bosses ? bossBar() : ""}${contextBlock(q)}
      ${label}
      <div class="${q.sprint ? "sprint-q" : "qtitle"}">${esc(q.title)}</div>
      ${q.tms ? `<div class="fuse" title="Standard: ${(q.tms / 1000).toFixed(1)}s"><i id="fuseBar" style="animation-duration:${q.tms}ms"></i></div>` : ""}
      ${q.auto ? `<form class="factform" id="numForm" autocomplete="off"><input id="numIn" class="fact-in" inputmode="decimal" autocomplete="off" aria-label="Your answer">${q.unit === "%" ? `<span class="fact-unit">%</span>` : ""}</form>`
      : `<form class="numrow" id="numForm" autocomplete="off">
        <input id="numIn" inputmode="text" placeholder="${q.unit === "%" ? "e.g. 12.5%" : q.unit === "yrs" ? "e.g. 3.5" : "e.g. 2.4m · use k / m / b"}" aria-label="Your answer">
        <button class="btn primary" type="submit">Submit</button>
      </form>`}
      ${q.sprint ? `<div class="flash" id="flash"></div>` : `<p class="hint">Within ${Math.round(q.tol * 100)}% counts.${q.auto ? "" : " Suffixes k / m / b work."}</p>`}
      <div id="fbslot"></div>`;
    const inp = $("#numIn"); inp.focus();
    $("#numForm").addEventListener("submit", e => { e.preventDefault(); answerNum(q.auto ? slotValue(q, inp.value) : inp.value); });
    if (q.auto) inp.addEventListener("input", () => {
      const clean = inp.value.replace(/[^\d.]/g, "");
      if (inp.value !== clean) inp.value = clean;
      if ((clean.match(/\d/g) || []).length >= q.auto) answerNum(slotValue(q, clean));
    });
  } else if (q.type === "tap") {
    q.sel = new Set();
    st.innerHTML = `<span class="eyebrow">Case prompt</span>
      <div class="qtitle">${q.title}</div>
      <div class="snipe" id="snipe">${q.tokens.map((t, i) => `<button type="button" class="word" data-i="${i}">${esc(t.w)}</button>`).join(" ")}</div>
      <div class="nextrow"><span class="hint" id="selCount">0 words highlighted</span><button class="btn primary" type="button" id="lockBtn">Lock in</button></div>
      <div id="fbslot"></div>`;
    st.querySelectorAll(".word").forEach(b => b.addEventListener("click", () => {
      if (S.answered) return;
      const i = +b.dataset.i; q.sel.has(i) ? q.sel.delete(i) : q.sel.add(i); b.classList.toggle("on");
      $("#selCount").textContent = `${q.sel.size} word${q.sel.size === 1 ? "" : "s"} highlighted`;
    }));
    $("#lockBtn").addEventListener("click", answerTap);
  } else if (q.type === "text") {
    st.innerHTML = `${contextBlock(q)}
      <div class="qtitle">${q.title}</div>
      <p class="hint">Verdict → two reasons with numbers → risk and next step. Aim for under 60 seconds and 75 words.</p>
      <textarea class="close-in" id="closeIn" placeholder="The client should…" aria-label="Your recommendation"></textarea>
      <div class="meter" id="meter"><span>Sentences <b>0</b></span><span>Words <b>0</b></span><span>Time <b>0s</b></span></div>
      <div class="nextrow"><span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to submit</span><button class="btn primary" type="button" id="closeBtn">Submit close</button></div>
      <div id="fbslot"></div>`;
    const ta = $("#closeIn"); ta.focus();
    const me = S;
    const upd = () => {
      if (S !== me || !$("#meter")) return clearInterval(me.meterTimer);
      if (S.answered) return;
      const ss = sentences(ta.value).length, wc = ta.value.trim().split(/\s+/).filter(Boolean).length, sec = Math.round((Date.now() - S.qStart) / 1000);
      $("#meter").innerHTML = `<span class="${ss > 3 ? "over" : ""}">Sentences <b>${ss}</b>/3</span><span class="${wc > 75 ? "over" : ""}">Words <b>${wc}</b></span><span class="${sec > 60 ? "over" : ""}">Time <b>${sec}s</b></span>`;
    };
    ta.addEventListener("input", upd);
    S.meterTimer = setInterval(upd, 1000);
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); answerText(); } });
    $("#closeBtn").addEventListener("click", answerText);
  }
}

function quipFor(ok) { return pick(ok >= .9 ? QUIPS.great : ok >= .7 ? QUIPS.good : ok >= .4 ? QUIPS.meh : QUIPS.bad); }

function showFeedback(ok, body, autoMs) {
  const slot = $("#fbslot");
  const verdicts = ok >= .75 ? ["Nailed it", "Crisp", "Partner-ready", "Clean", "Yes"] : ok >= .4 ? ["Partly there", "Close", "Half credit"] : ["Not quite", "Miss", "Let's fix that"];
  slot.innerHTML = `<div class="fb ${ok >= .75 ? "ok" : "no"}"><span class="verdict">${pick(verdicts)}</span>${body}</div>
    <div class="nextrow" style="margin-top:10px"><button class="btn primary" type="button" id="nextBtn">${S.idx + 1 >= S.queue.length ? "See results" : "Next"} <kbd style="background:transparent;color:inherit;border-color:currentColor">Enter</kbd></button></div>`;
  $("#nextBtn").addEventListener("click", next);
  $("#nextBtn").focus({ preventScroll: true });
  slot.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function answerMCQ(i) {
  if (S.answered) return; S.answered = true;
  const q = current(), ok = i === q.answer;
  const r = record(ok ? 1 : 0);
  $("#stage").querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === q.answer) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
  if (q.sprint) { const me = S; setTimeout(() => { if (S === me) next(); }, ok ? 380 : 1500); return; }
  const slow = r.ms > SKILLS[q.skill].target ? ` <span class="muted">(${(r.ms / 1000).toFixed(0)}s, target ${(SKILLS[q.skill].target / 1000).toFixed(0)}s)</span>` : "";
  showFeedback(ok ? 1 : 0, `<div>${q.explain}</div><span class="quip">+${r.gained} XP${slow}</span>`);
}

function answerNum(v) {
  if (S.answered) return;
  if (!String(v).trim()) return;
  const q = current();
  let x = parseNum(v);
  if (isNaN(x)) { const f = $("#flash") || $("#fbslot"); f.className = f.id === "flash" ? "flash no" : ""; f.innerHTML = `<p class="hint" style="color:var(--bad)">Type a number, like 2.4m or 15%.</p>`; return; }
  S.answered = true;
  // Accept "12" for 12% and money answers given in $M if user typed a bare small number
  const target = q.answer;
  const near = (a) => Math.abs(a - target) <= Math.max(Math.abs(target) * q.tol, q.abs || 0);
  const ok = near(x);
  // Right digits at the wrong scale (e.g. 960 for 960K) is a zeros error, not a pass
  const magMiss = !ok && [1e3, 1e6, 1e9, 1e-3, 1e-6, 1e-9].some(m => near(x * m));
  const magNote = magMiss ? "Right digits, wrong magnitude. Count the zeros, or add k / m / b." : "";
  const r = record(ok ? 1 : 0);
  const shown = q.unit === "%" ? (+target.toFixed(2)) + "%" : q.unit === "yrs" ? target.toFixed(1) + " yrs" : q.dollars ? money(target) : fmtNum(target);
  const fb = $("#fuseBar"); if (fb) fb.style.animationPlayState = "paused";
  const fi = $(".fact-in"); if (fi) fi.classList.add(ok ? "ok" : "no");
  const fast = q.tms && r.ms <= q.tms;
  if (!ok && q.c && S.sprint && S.mode !== "boss") S.reask.push({ c: q.c, f: q.f, due: S.queue.length + ri(2, 3) });
  let bossMsg = "", delay = ok ? (fast ? 420 : 650) : q.tip ? 2600 : 1600;
  if (S.bosses) {
    const b = S.bosses.find(x => x.k === q.c + "|" + q.f);
    if (ok && fast) { b.hp--; bossMsg = b.hp ? "  ·  hit!" : "  ·  boss defeated!"; }
    else if (ok) bossMsg = `  ·  too slow to land a hit (${(r.ms / 1000).toFixed(1)}s vs ${(q.tms / 1000).toFixed(1)}s)`;
    else { b.hp = Math.min(3, b.hp + 1); bossMsg = "  ·  boss heals"; }
    const bar = $("#stage .bosses");
    if (bar) { bar.outerHTML = bossBar(); const ne = $(`#stage .boss[data-k="${CSS.escape(b.k)}"]`); if (ne) ne.classList.add(ok && fast ? "hit" : ok ? "cur" : "heal"); }
    if (!b.hp) delay = 900;
    if (S.bosses.every(x => !x.hp)) S.endAt = Date.now();
  }
  if (q.sprint) {
    const f = $("#flash"); f.className = "flash " + (ok ? "ok" : "no");
    f.textContent = (ok ? `✓ ${shown}${fast && !S.bosses ? "  ·  under standard" : ""}` : `✗ ${shown}  ·  ${magNote || q.tip || ""}`) + bossMsg;
    const fx0 = !ok && q.fx && q.fx[0] && FORMULAS[q.fx[0]];
    if (fx0) { f.insertAdjacentHTML("beforeend", `<div class="flash-fx">${esc(fx0.term)}: <code>${esc(fx0.formula)}</code></div>`); delay += 1200; }
    $("#numIn").disabled = true;
    const me = S; setTimeout(() => { if (S === me) next(); }, delay); return;
  }
  $("#numIn").disabled = true;
  showFeedback(ok ? 1 : 0, `<div>Answer: <b class="num">${shown}</b>. You said <span class="num">${esc(v)}</span>.${magNote ? ` <b>${magNote}</b>` : ""}</div>
    ${formulaHTML(q.fx)}
    ${q.steps ? `<ul>${q.steps.map(s => `<li class="num" style="font-family:var(--body)">${esc(s)}</li>`).join("")}</ul>` : q.tip ? `<div class="muted">${esc(q.tip)}</div>` : ""}
    <span class="quip">+${r.gained} XP · ${(r.ms / 1000).toFixed(0)}s (partner pace: ${(SKILLS[q.skill].target / 1000).toFixed(0)}s)</span>`);
}

function answerTap() {
  if (S.answered) return; S.answered = true;
  const q = current();
  const hitCons = new Set(); let fp = 0;
  q.sel.forEach(i => { const c = q.tokens[i].c; if (c >= 0) hitCons.add(c); else fp++; });
  const recall = hitCons.size / q.cons.length;
  const precision = q.sel.size ? (q.sel.size - fp) / q.sel.size : 0;
  const okv = clamp(recall - fp * 0.08, 0, 1);
  const r = record(okv);
  S.items[S.items.length - 1].tap = 1;
  $("#snipe").querySelectorAll(".word").forEach((b, i) => {
    const t = q.tokens[i]; b.disabled = true; b.classList.remove("on");
    if (t.c >= 0) b.classList.add(hitCons.has(t.c) ? "hit" : "miss");
    else if (q.sel.has(i)) b.classList.add("fp");
  });
  $("#lockBtn").disabled = true;
  const why = q.cons.map((c, i) => `<div><b>${esc(c.phrase)}</b><span>${hitCons.has(i) ? "✓" : "<span style='color:var(--bad)'>missed</span>"} · ${esc(c.why)}</span></div>`).join("");
  showFeedback(okv, `<div>Caught <b class="num">${hitCons.size}/${q.cons.length}</b> constraints${fp ? `, with <b class="num">${fp}</b> word${fp > 1 ? "s" : ""} that ${fp > 1 ? "don't" : "doesn't"} change the framework` : ""}.</div>
    <div class="why">${why}</div><span class="quip">+${r.gained} XP · ${quipFor(okv)}</span>`);
}

function answerText() {
  if (S.answered) return;
  const q = current(), v = $("#closeIn").value;
  if (v.trim().split(/\s+/).length < 8) { $("#meter").insertAdjacentHTML("beforeend", `<span class="over">Write at least one full sentence first.</span>`); return; }
  S.answered = true; clearInterval(S.meterTimer);
  const g = gradeClose(v, q.closeCase);
  const r = record(g.score / 5, { score: g.score });
  $("#closeIn").disabled = true;
  const detail = {
    three: ` <span class="muted">(you wrote ${g.ss.length})</span>`,
    verdict: g.hedges.length ? ` <span class="muted">(hedge: ${g.hedges.map(h => `"${esc(h)}"`).join(", ")})</span>` : "",
    nums: ` <span class="muted">(${g.matched.length ? "used " + g.matched.join(", ") : "none of the case's figures found"})</span>`,
    call: g.callMatch ? "" : ` <span class="muted">(you said ${g.call}; the facts point to ${g.modelCall})</span>`,
  };
  const list = g.checks.map(c => `<li><span class="m ${c.ok ? "y" : "n"}">${c.ok ? "✓" : "✗"}</span><span>${c.label}${detail[c.key] || ""}</span></li>`).join("")
    + g.penalties.map(p => `<li><span class="m n">−</span><span>${esc(p)}</span></li>`).join("");
  showFeedback(g.score / 5, `<div><b class="num">${g.score}/5</b> on the close rubric · ${(r.ms / 1000).toFixed(0)}s · ${g.words} words</div>
    ${closeBreakdown(g)}
    <ul class="rubric">${list}</ul>
    <div class="model"><span class="eyebrow">Model close</span><p>${esc(q.model)}</p></div>
    <span class="quip">+${r.gained} XP · ${quipFor(g.score / 5)}</span>`);
}

/* ============================================================
   Results
   ============================================================ */
async function finish() {
  clearInterval(timerId); clearInterval(S && S.meterTimer);
  if (!S) return;
  const s = S; S = null; screen = "results";
  if (!s.items.length) return renderHome();
  const before = totals().xp;
  const rec = { id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: Date.now(), mode: s.mode, items: s.items, xp: s.xp, bestCombo: s.bestCombo };
  if (s.sprint) rec.dur = Math.round(Math.min(s.sprint, (Date.now() - s.startTs) / 1000));
  const isMath = s.mode === "math" || s.mode === "weak" || s.mode === "boss" || s.mode.startsWith("m:");
  const prev = Store.recs.filter(r => r.mode === s.mode).slice(-1)[0];
  Store.add(rec);
  const acc = s.items.reduce((a, b) => a + b.ok, 0) / s.items.length;
  const avgMs = s.items.reduce((a, b) => a + b.ms, 0) / s.items.length;
  const prevAcc = prev ? prev.items.reduce((a, b) => a + b.ok, 0) / prev.items.length : null;
  const r0 = rankFor(before), r1 = rankFor(before + s.xp);
  const correctN = s.items.filter(i => i.ok >= .75).length;
  const delta = prevAcc == null ? `<span class="muted">first run</span>` : acc - prevAcc >= 0 ? `<span class="delta-up">▲ ${pct(acc - prevAcc)}</span>` : `<span class="delta-dn">▼ ${pct(prevAcc - acc)}</span>`;
  const bySkill = {};
  s.items.forEach(i => { (bySkill[i.s] = bySkill[i.s] || []).push(i); });
  const review = Object.keys(bySkill).map(k => {
    const a = bySkill[k], ac = a.reduce((x, y) => x + y.ok, 0) / a.length, ms = a.reduce((x, y) => x + y.ms, 0) / a.length;
    return `<div><span class="pill ${ac >= .85 ? "mast" : ac >= .6 ? "prog" : "work"}">${pct(ac)}</span><span><b>${SKILLS[k].name}</b> · ${a.length} item${a.length > 1 ? "s" : ""} · avg ${(ms / 1000).toFixed(1)}s vs ${(SKILLS[k].target / 1000).toFixed(0)}s target</span></div>`;
  }).join("");
  const sprintLine = s.sprint ? `<p><b class="num">${correctN}</b> correct in ${rec.dur} seconds${prev ? ` · last time <b class="num">${prev.items.filter(i => i.ok >= .75).length}</b>` : ""}.</p>` : "";
  let mathBlock = "";
  if (s.bosses) {
    const dead = s.bosses.filter(b => !b.hp).length;
    mathBlock += `<div class="std ${dead === s.bosses.length ? "met" : ""}"><b class="num">${dead}/${s.bosses.length}</b> bosses defeated${dead === s.bosses.length ? ` in ${rec.dur} seconds` : ""}. A hit needs a correct answer under the standard time.</div>
      <div class="bosses">${s.bosses.map(b => { const [c, f] = b.k.split("|"); return `<div class="boss ${b.hp ? "" : "dead"}"><span class="bname">${esc(factLabel(f))}</span><span class="hp">${[0, 1, 2].map(i => `<i class="${i < b.hp ? "on" : ""}"></i>`).join("")}</span><span class="bcat">${esc(MATH_CATS[c].name)}</span></div>`; }).join("")}</div>`;
  }
  if (isMath) {
    const cpm = correctN / (rec.dur / 60);
    if (s.mode.startsWith("m:")) {
      const C = MATH_CATS[s.mode.slice(2)], met = cpm >= C.cpm && acc >= C.acc;
      mathBlock += `<div class="std ${met ? "met" : ""}"><b class="num">${cpm.toFixed(1)}</b> correct per minute · standard <b class="num">${C.cpm}</b> at ${pct(C.acc)} accuracy · ${met ? "standard met" : `${Math.max(0, C.cpm - cpm).toFixed(1)} short`}${rec.dur < 45 ? " · ended early, so this doesn't count as a timed check" : ""}</div>`;
    }
    const byCat = {};
    s.items.filter(i => i.c).forEach(i => (byCat[i.c] = byCat[i.c] || []).push(i));
    if (Object.keys(byCat).length > 1) mathBlock += `<div class="review">${Object.keys(byCat).map(k => { const a = byCat[k], ac = a.filter(i => i.ok >= 1).length / a.length, ms = a.reduce((x, y) => x + y.ms, 0) / a.length; return `<div><span class="pill ${ac >= MATH_CATS[k].acc ? "mast" : ac >= .7 ? "prog" : "work"}">${pct(ac)}</span><span><b>${MATH_CATS[k].name}</b> · ${a.length} · avg ${(ms / 1000).toFixed(1)}s vs ${(60 / MATH_CATS[k].cpm).toFixed(1)}s standard</span></div>`; }).join("")}</div>`;
    const slow = s.items.map((i, n) => ({ i, q: s.results[n] && s.results[n].q })).filter(x => x.i.c && x.q).sort((a, b) => (b.i.ok < 1) - (a.i.ok < 1) || b.i.ms - a.i.ms).slice(0, 5);
    if (slow.length) mathBlock += `<div><span class="eyebrow">Slowest or missed this run</span><div class="review">${slow.map(x => {
      const ans = x.q.unit === "%" ? (+x.q.answer.toFixed(1)) + "%" : fmtNum(x.q.answer);
      return `<div><span class="num" style="min-width:4.5em">${(x.i.ms / 1000).toFixed(1)}s</span><span>${x.i.ok >= 1 ? `✓ ${esc(x.q.title)} = ${esc(ans)}` : `<span style='color:var(--bad)'>✗</span> ${esc(x.q.title)} <span class="muted">· ${esc(x.q.tip || ans)}</span>`}</span></div>`;
    }).join("")}</div></div>`;
    // Strategy for the drill (single-category check) or for each category missed in a mixed run
    const stratCats = s.mode.startsWith("m:") ? [s.mode.slice(2)] : [...new Set(s.items.filter(i => i.c && i.ok < 1).map(i => i.c))].slice(0, 2);
    mathBlock += stratCats.map(k => `<details class="stratbox"><summary>How to get faster at ${esc(MATH_CATS[k].name)}</summary>${strategyHTML(MATH_CATS[k])}</details>`).join("");
  }
  $("#view").innerHTML = `
  <div class="wrap">
    <section class="card results">
      <span class="eyebrow">${esc(modeName(s.mode))} · debrief</span>
      <h2 style="font-size:1.8rem">${acc >= .9 ? "Partner-ready." : acc >= .7 ? "Strong work." : acc >= .45 ? "Getting there." : "Tough room."}</h2>
      <p class="muted" style="font-style:italic">${quipFor(acc)}</p>
      ${r1.i > r0.i ? `<div class="rankup">Promoted to ${r1.name}.</div>` : ""}
      ${sprintLine}
      <div class="big">
        <div><b>${pct(acc)}</b><span>accuracy ${delta}</span></div>
        <div><b>${(avgMs / 1000).toFixed(1)}s</b><span>avg per item</span></div>
        <div><b>+${s.xp}</b><span>XP earned</span></div>
        <div><b>×${s.bestCombo}</b><span>best combo</span></div>
      </div>
      ${isMath ? mathBlock : `<div class="review">${review}</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" type="button" id="againBtn">Run it back <kbd style="background:transparent;color:inherit;border-color:currentColor">Enter</kbd></button>
        ${isMath ? `<button class="btn" type="button" id="gymBtn2">Back to Math Gym</button>` : ""}
        <button class="btn" type="button" id="homeBtn2">Back to dashboard</button>
      </div>
    </section>
  </div>`;
  $("#againBtn").addEventListener("click", () => s.bosses ? renderGym() : startSession(s.mode, { weak: s.weak }));
  if (s.bosses) $("#againBtn").firstChild.textContent = "Pick new bosses ";
  if (isMath) $("#gymBtn2").addEventListener("click", renderGym);
  $("#homeBtn2").addEventListener("click", renderHome);
  resultsAt = Date.now();
  setTimeout(() => { if (screen === "results" && $("#againBtn") && document.activeElement === document.body) $("#againBtn").focus({ preventScroll: true }); }, 500);
  if (acc >= .8 || r1.i > r0.i) confetti();
  scrollTo(0, 0);
}

let confettiRun = 0;
function stopConfetti() { confettiRun++; const c = $("#confetti"); c.getContext("2d").clearRect(0, 0, c.width, c.height); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const run = ++confettiRun;
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--hl", "--good"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 120 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height * .5, 0), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), r: rnd(0, 6.28), vr: rnd(-.2, .2), w: rnd(6, 11), h: rnd(3, 6), col: pick(cols) }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (run !== confettiRun) return;
    if (++f < 150) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ============================================================
   Keyboard + boot
   ============================================================ */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;   // leave browser shortcuts alone
  if ($("#glossary")) { if (e.key === "Escape") closeGlossary(); return; }
  const t = e.target, tag = (t.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  const onButton = tag === "button";
  if (!S) {
    if (typing) return;
    if ((e.key === "d" || e.key === "D") && screen === "home") startSession("daily");
    // On results, Enter runs it back only once the screen has settled and nothing else has focus
    if (e.key === "Enter" && screen === "results" && !onButton && Date.now() - resultsAt > 500 && $("#againBtn")) { e.preventDefault(); $("#againBtn").click(); }
    return;
  }
  if (e.key === "Escape") { if (tag === "textarea") { t.blur(); return; } requestQuit(); return; }
  const q = current();
  if (!q || $("#quitBar")) return;
  if (S.answered && e.key === "Enter" && !onButton && !typing && $("#nextBtn")) { e.preventDefault(); next(); return; }
  if (!S.answered && q.type === "mcq" && /^[1-9]$/.test(e.key) && !typing) {
    const i = +e.key - 1; if (i < q.options.length) answerMCQ(i);
  }
  if (!S.answered && q.type === "tap" && e.key === "Enter" && !onButton) { e.preventDefault(); answerTap(); }
});
$("#homeBtn").addEventListener("click", () => { if (S) requestQuit(); else renderHome(); });

// Quitting after answering anything asks once, in the page (the viewer blocks confirm()).
function requestQuit() {
  if (!S) return renderHome();
  if (!S.items.length) return renderHome();
  if ($("#quitBar")) return finish();
  const bar = document.createElement("div");
  bar.id = "quitBar"; bar.className = "quitbar"; bar.setAttribute("role", "alertdialog"); bar.setAttribute("aria-label", "Quit session");
  bar.innerHTML = `<span>End this session? Your ${S.items.length} answer${S.items.length > 1 ? "s" : ""} so far will be saved.</span><span class="qb"><button class="btn sm" type="button" id="qbKeep">Keep going</button><button class="btn sm primary" type="button" id="qbEnd">End and save</button></span>`;
  $("#stage").before(bar);
  $("#qbEnd").addEventListener("click", finish);
  $("#qbKeep").addEventListener("click", () => { bar.remove(); const f = $("#numIn:not([disabled])") || $("#closeIn:not([disabled])") || $("#nextBtn") || $(".opt:not([disabled])"); if (f) f.focus(); });
  $("#qbKeep").focus();
}

Store.load();
renderHome();
Store.connect();
</script>
