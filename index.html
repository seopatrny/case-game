<title>Case Cracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a steering-committee "deck" turned arcade. Cool graph-paper ground, white slide cards,
   cobalt for action, highlighter yellow for the things you must not miss. */
:root {
  --bg: #eaeef5;
  --grid: #dde3ee;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --ink: #131a2c;
  --muted: #586379;
  --line: #d3dae7;
  --accent: #2b45f0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8ff;
  --hl: #ffe45c;
  --hl-ink: #131a2c;
  --good: #10794a;
  --good-soft: #def3e8;
  --bad: #c0352e;
  --bad-soft: #fbe3e1;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --grid: #151c2f; --surface: #161d30; --surface-2: #1c2439; --ink: #e8ecf6; --muted: #9ba5bc;
    --line: #2a3352; --accent: #7d8dff; --accent-ink: #0d1220; --accent-soft: #232c55; --hl: #e9c92c; --hl-ink: #131a2c;
    --good: #4cc48b; --good-soft: #15342a; --bad: #ff7d72; --bad-soft: #3d1d1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --grid: #151c2f; --surface: #161d30; --surface-2: #1c2439; --ink: #e8ecf6; --muted: #9ba5bc;
  --line: #2a3352; --accent: #7d8dff; --accent-ink: #0d1220; --accent-soft: #232c55; --hl: #e9c92c; --hl-ink: #131a2c;
  --good: #4cc48b; --good-soft: #15342a; --bad: #ff7d72; --bad-soft: #3d1d1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wrap .wrap { max-width: none; margin: 0; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .word:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
.brand mark { background: var(--hl); color: var(--hl-ink); padding: 0 .2em; border-radius: 3px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .82rem; font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on .dot { background: var(--good); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
kbd { font-family: var(--mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface-2); }

/* hero */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.hero > * { min-width: 0; }
.hero.duo { grid-template-columns: 1fr 1fr; }
.rank-card { display: flex; flex-direction: column; gap: 12px; }
.rank-title { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 4.6vw, 2.5rem); letter-spacing: -.02em; }
.xpbar { height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
.stats-row { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.shift { background: var(--ink); color: var(--bg); border-color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.shift .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.shift h2 { font-size: 1.5rem; }
.shift p { color: color-mix(in srgb, var(--bg) 82%, transparent); font-size: .92rem; }
.shift .btn.primary { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); align-self: flex-start; margin-top: auto; }

/* modes */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; transition: transform .12s ease, border-color .12s; }
.mode:hover { transform: translateY(-2px); border-color: var(--accent); }
.mode .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.hl { background: var(--hl); color: var(--hl-ink); }
.mode p { font-size: .88rem; color: var(--muted); }
.mode .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; }
.mode-math { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-math > .mode { min-width: 0; }

/* progress */
.ptable-wrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 560px; }
.ptable th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ptable tr:last-child td { border-bottom: 0; }
.mbar { width: 110px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.mbar.done i { background: var(--good); }
.pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.work { background: var(--bad-soft); color: var(--bad); }
.pill.prog { background: var(--accent-soft); color: var(--accent); }
.pill.mast { background: var(--good-soft); color: var(--good); }
.spark { display: block; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; color: var(--muted); }
.badge.got { border-style: solid; border-color: var(--hl); background: color-mix(in srgb, var(--hl) 22%, var(--surface)); color: var(--ink); font-weight: 600; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.backup { display: flex; flex-direction: column; gap: 8px; }
.backup textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: .75rem; }

/* game */
.gamebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.gamebar .left { display: flex; align-items: center; gap: 12px; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.ok { background: var(--good); }
.pip.part { background: var(--hl); }
.pip.no { background: var(--bad); }
.pip.cur { background: var(--accent); }
.hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.combo { font-family: var(--display); font-weight: 800; color: var(--accent); min-width: 3.5em; text-align: right; }
.combo.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.35); } }
.timer { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.stage { display: flex; flex-direction: column; gap: 16px; }
.qtitle { font-family: var(--display); font-weight: 700; font-size: clamp(1.15rem, 3.2vw, 1.45rem); line-height: 1.25; }
.prompt-text { font-size: 1rem; }
.exhibit { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.exhibit .cap { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ex-wrap { overflow-x: auto; }
.ex { border-collapse: collapse; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .88rem; min-width: 320px; width: 100%; }
.ex th, .ex td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); }
.ex th:first-child, .ex td:first-child { text-align: left; font-family: var(--body); }
.ex th { font-size: .75rem; color: var(--muted); font-weight: 600; }
.ex tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--mono); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-top: 2px; flex: none; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.numrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.numrow input { flex: 1 1 180px; min-width: 0; font-family: var(--mono); font-size: 1.3rem; padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.hint { font-size: .8rem; color: var(--muted); }
.fb { border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.fb.ok { border-color: var(--good); }
.fb.no { border-color: var(--bad); }
.fb .verdict { font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--good); }
.fb.no .verdict { color: var(--bad); }
.fb ul { margin: 0; padding-left: 1.2em; }
.fb .quip { font-style: italic; color: var(--muted); font-size: .88rem; }
.nextrow { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.flash { font-family: var(--display); font-weight: 800; font-size: 1.1rem; min-height: 1.6em; }
.flash.ok { color: var(--good); }
.flash.no { color: var(--bad); }
.sprint-q { font-family: var(--mono); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; text-align: center; padding: 18px 6px; line-height: 1.3; }
.lingo-q { font-family: var(--display); font-size: clamp(1.25rem, 4vw, 1.6rem); font-weight: 700; text-align: center; padding: 10px 4px; }

/* sniper */
.snipe { font-size: 1.12rem; line-height: 2.05; }
.word { display: inline; padding: 2px 3px; border-radius: 3px; cursor: pointer; border: 0; background: none; font: inherit; color: inherit; }
.word:hover { background: var(--accent-soft); }
.word.on { background: var(--hl); color: var(--hl-ink); }
.word.miss { box-shadow: inset 0 -3px 0 var(--bad); }
.word.fp { text-decoration: line-through; text-decoration-color: var(--bad); }
.word.hit { background: var(--hl); color: var(--hl-ink); box-shadow: inset 0 -3px 0 var(--good); }
.why { display: grid; gap: 6px; }
.why div { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 10px; font-size: .9rem; }
.why b { background: var(--hl); color: var(--hl-ink); padding: 0 6px; border-radius: 3px; align-self: start; font-weight: 600; }

/* close */
.facts { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
textarea.close-in { width: 100%; min-height: 140px; font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
.meter { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.meter b { font-family: var(--mono); color: var(--ink); }
.meter .over { color: var(--bad); }
.rubric { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rubric li { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; }
.rubric .m { font-family: var(--mono); font-weight: 700; flex: none; width: 1.2em; }
.rubric .y { color: var(--good); }
.rubric .n { color: var(--bad); }
.model { border-left: 3px solid var(--accent); padding-left: 12px; }

/* bridge chart */
.bridge { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: 120px 1fr 74px; gap: 8px; align-items: center; font-size: .82rem; }
.btrack { position: relative; height: 16px; }
.btrack::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.bbar { position: absolute; top: 2px; height: 12px; border-radius: 3px; }
.bbar.neg { background: var(--bad); }
.bbar.pos { background: var(--good); }
.brow .v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* results */
.results { display: flex; flex-direction: column; gap: 16px; }
.big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.big > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.big b { display: block; font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.big span { font-size: .75rem; color: var(--muted); }
.delta-up { color: var(--good); font-weight: 700; }
.delta-dn { color: var(--bad); font-weight: 700; }
.rankup { background: var(--hl); color: var(--hl-ink); border-radius: 8px; padding: 12px 14px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.review { display: grid; gap: 6px; font-size: .88rem; }
.review div { display: flex; gap: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* math gym */
.small { font-size: .8rem; }
.btn.sm { padding: 5px 11px; font-size: .82rem; }
.gymdots { display: flex; gap: 4px; flex-wrap: wrap; }
.gd { width: 22px; height: 8px; border-radius: 3px; background: var(--line); }
.gd.ready { background: var(--good); }
.gd.close { background: var(--accent); }
.gd.below { background: var(--bad); }
.gd.untimed { background: var(--muted); }
.ladder td { vertical-align: top; }
.ladder tr.tier td { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 6px 8px; }
.ladder .acts { white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.cpmcell { display: flex; flex-direction: column; gap: 4px; min-width: 110px; }
.cpmbar { position: relative; height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; }
.cpmbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--muted); }
.cpmbar i.ready { background: var(--good); }
.cpmbar i.close { background: var(--accent); }
.cpmbar i.below { background: var(--bad); }
.cpmbar .tick { position: absolute; left: 80%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.strat-row td { background: var(--surface-2); }
.strat-row ul { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.nextup { display: flex; gap: 10px; align-items: center; }
.facts-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.facts-layout .row, .fpanel .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.heat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .68rem; }
.heat .hh { display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--muted); aspect-ratio: 1; }
.hc { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); color: var(--muted); max-width: 100%; }
.hc.fast, .fchip.fast { background: var(--good-soft); color: var(--good); }
.hc.slow, .fchip.slow { background: color-mix(in srgb, var(--hl) 60%, var(--surface)); color: var(--hl-ink); }
.hc.miss, .fchip.miss { background: var(--bad-soft); color: var(--bad); }
.fpanels { display: grid; gap: 14px; }
.fpanel { display: flex; flex-direction: column; gap: 6px; }
.fpanel h3 { font-size: .92rem; }
.fchips { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.fchip.fast, .fchip.slow, .fchip.miss { border-color: transparent; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i.fchip { width: 14px; height: 12px; padding: 0; }
.neg { color: var(--bad); }
.std { border-radius: 8px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface-2); }
.std.met { border-color: var(--good); background: var(--good-soft); }
.standards p { max-width: 75ch; font-size: .92rem; }
.standards a { color: var(--accent); }

/* fact entry: compact auto-submit box, fuse, bosses */
.factform { display: flex; justify-content: center; align-items: center; gap: 8px; }
.fact-in { width: 7.5rem; font-family: var(--mono); font-size: 1.8rem; font-weight: 600; text-align: center; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.fact-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.fact-in.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.fact-in.no { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); animation: shake .3s ease; }
.fact-unit { font-family: var(--mono); font-size: 1.8rem; font-weight: 600; color: var(--muted); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.fuse { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; max-width: 360px; width: 100%; margin: 0 auto; }
.fuse i { display: block; height: 100%; width: 100%; background: var(--good); animation-name: fuse; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes fuse { 0% { width: 100%; background: var(--good); } 60% { background: var(--hl); } 100% { width: 0%; background: var(--bad); } }
.again { text-align: center; color: var(--bad); }
.bosses { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }

/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
// "an 8%", "a 6%": the article follows how the number is spoken
const aPct = n => (/^(8|11|18|8\d)(\.|$)/.test(String(n)) ? "an " : "a ") + n + "%";
// Exact when the value ends within two decimals (6.25, 18.75), otherwise one decimal (33.3)
const exactNum = v => { const r2 = Math.round(v * 100) / 100; return String(Math.abs(v - r2) < 1e-9 ? r2 : +v.toFixed(1)); };

function fmtNum(x) {
  const a = Math.abs(x), s = x < 0 ? "−" : "";

  if (a >= 1e12) return s + trim(a / 1e12) + "T";
  if (a >= 1e9) return s + trim(a / 1e9) + "B";
  if (a >= 1e6) return s + trim(a / 1e6) + "M";
  if (a >= 1e4) return s + trim(a / 1e3) + "K";

}
const money = x => (x < 0 ? "−$" : "$") + fmtNum(Math.abs(x));
const mUSD = (x, d = 1) => (x < 0 ? "−$" : "$") + Math.abs(x).toFixed(d) + "M";

// "2.4m", "$1,200", "12%", "3.5b", "840k", "1.2 bn"
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim().toLowerCase().replace(/[$,\s]/g, "").replace(/−/g, "-");
  if (!s) return NaN;
  const fr = s.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/);
  if (fr) return +fr[2] ? +fr[1] / +fr[2] : NaN;
  let mult = 1;
  const m = s.match(/(trillion|billion|million|thousand|bn|mm|tn|t|b|m|k|%|x|yrs?|years?)$/);
  if (m) {
    const u = m[1];
    mult = { t: 1e12, tn: 1e12, trillion: 1e12, b: 1e9, bn: 1e9, billion: 1e9, m: 1e6, mm: 1e6, million: 1e6, k: 1e3, thousand: 1e3 }[u] || 1;

/* ============================================================
   Storage: records live in the artifact database when available,
   with a localStorage mirror so the game also works offline.
   ============================================================ */
const LS_KEY = "caseCracker.v1";
const Store = {
  recs: [], col: null,
  load() {
    try { const r = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); this.recs = Array.isArray(r) ? r : []; } catch (e) { this.recs = []; }
  },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.recs)); } catch (e) {} },
  async connect() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      const snap = await this.col.get();
      const remote = snap.docs.map(d => d.data()).filter(r => r && r.id && r.ts);
      const ids = new Set(remote.map(r => r.id));
      const localOnly = this.recs.filter(r => !ids.has(r.id));
      this.recs = remote.concat(localOnly).sort((a, b) => a.ts - b.ts);
      this.saveLocal();
      setSync(true);
      for (const r of localOnly) { try { await this.col.doc(r.id).set(r); } catch (e) {} }
      if (screen === "home") renderHome();
    } catch (e) { /* stay local */ }
  },
  async add(r) {
    this.recs.push(r); this.saveLocal();
    if (this.col) { try { await this.col.doc(r.id).set(r); } catch (e) {} }
  },
  async importAll(list) {
    const ids = new Set(this.recs.map(r => r.id));
    const fresh = list.filter(r => r && r.id && r.ts && r.mode && Array.isArray(r.items) && !ids.has(r.id));
    for (const r of fresh) await this.add(r);
    this.recs.sort((a, b) => a.ts - b.ts); this.saveLocal();
    return fresh.length;
  }
};

/* ============================================================

const SKILLS = {

const RANKS = [
  [0, "Summer Intern"], [300, "Business Analyst"], [900, "Senior BA"], [1800, "Associate"],

const QUIPS = {
  great: ["The partner just forwarded your deck to the client unedited.", "Your EM wants you staffed on every case. Forever.", "Somewhere, a Bain recruiter felt a disturbance.", "That was cleaner than a 2x2 matrix.", "Offer letter energy."],

/* ============================================================
   CONTENT: Metric Hunt (procedural)
   ============================================================ */
const INDUSTRIES = [
  { co: "Ridgeline Roasters", what: "a specialty coffee roaster", unit: "bags", P: [14, 22], rev: [60, 180], vr: [.5, .62] },
  { co: "Aerlinn", what: "a European regional airline", unit: "seats sold", P: [95, 170], rev: [300, 900], vr: [.55, .68] },
  { co: "Stackwise", what: "a mid-market SaaS company", unit: "seat licenses", P: [320, 620], rev: [80, 260], vr: [.18, .3] },
  { co: "Pulse Fitness", what: "a US fitness chain", unit: "memberships", P: [420, 720], rev: [120, 400], vr: [.35, .5] },
  { co: "Halcyon Audio", what: "a consumer electronics maker", unit: "headphones", P: [90, 220], rev: [150, 600], vr: [.55, .66] },
  { co: "Torrent Industrial", what: "an industrial pump manufacturer", unit: "pumps", P: [2200, 5200], rev: [100, 350], vr: [.52, .64] },
  { co: "Greenleaf Grocers", what: "a regional grocery chain", unit: "baskets", P: [38, 62], rev: [500, 1400], vr: [.7, .78] },
  { co: "Northgate Hotels", what: "a US midscale hotel group", unit: "room-nights", P: [110, 190], rev: [200, 700], vr: [.32, .45] },
];
const DRIVERS = {
  volume: { label: "Volume (units sold)", phrase: "lower volume", dig: "check whether the volume loss is concentrated in one segment, channel, or region" },
  price: { label: "Average price", phrase: "lower average price", dig: "split the price drop into list-price cuts, discounting, and mix shift" },
  varcost: { label: "Variable cost per unit", phrase: "higher variable cost per unit", dig: "break unit cost into materials, labor, and logistics to see which component moved" },
  fixed: { label: "Fixed costs", phrase: "higher fixed costs", dig: "see which fixed line (SG&A, rent, D&A) grew and whether it was a one-off" },
};

function genPQVF() {
  for (let tries = 0; tries < 60; tries++) {
    const ind = pick(INDUSTRIES);
    const main = pick(Object.keys(DRIVERS));
    const P1 = roundTo(rnd(ind.P[0], ind.P[1]), ind.P[0] > 1000 ? 50 : ind.P[0] > 80 ? 5 : 0.5);
    const rev1 = rnd(ind.rev[0], ind.rev[1]);
    const Q1 = roundTo(rev1 * 1000 / P1, 10);                 // thousands of units
    const V1 = roundTo(P1 * rnd(ind.vr[0], ind.vr[1]), P1 > 1000 ? 10 : P1 > 80 ? 1 : 0.1);
    const contrib1 = Q1 * (P1 - V1) / 1000;
    const F1 = roundTo(contrib1 * rnd(.55, .72), 0.5);
    const noise = () => 1 + rnd(-.02, .02);
    let Q2 = Q1 * noise(), P2 = P1 * noise(), V2 = V1 * noise(), F2 = F1 * noise();
    if (main === "volume") Q2 = Q1 * (1 - rnd(.12, .24));
    if (main === "price") P2 = P1 * (1 - rnd(.06, .12));
    if (main === "varcost") V2 = V1 * (1 + rnd(.1, .2));
    if (main === "fixed") F2 = F1 * (1 + rnd(.18, .35));
    Q2 = roundTo(Q2, 10); P2 = roundTo(P2, P1 > 1000 ? 50 : P1 > 80 ? 1 : 0.1); V2 = roundTo(V2, P1 > 1000 ? 10 : P1 > 80 ? 1 : 0.1); F2 = roundTo(F2, 0.5);
    const pr1 = contrib1 - F1, pr2 = Q2 * (P2 - V2) / 1000 - F2;
    const eff = {
      price: Q2 * (P2 - P1) / 1000,
      volume: (Q2 - Q1) * (P1 - V1) / 1000,
      varcost: -Q2 * (V2 - V1) / 1000,
      fixed: -(F2 - F1),
    };
    const others = Object.keys(eff).filter(k => k !== main);
    const ok = eff[main] < 0 && others.every(k => Math.abs(eff[k]) * 2.5 < Math.abs(eff[main])) && pr2 < pr1 * .92 && pr1 > 2;
    if (!ok) continue;
    return { ind, main, P1, P2, Q1, Q2, V1, V2, F1, F2, pr1, pr2, eff, rev1: Q1 * P1 / 1000, rev2: Q2 * P2 / 1000 };
  }
  return genPQVF();
}

function bridgeHTML(eff, labels, total, hideValues) {

// Keep generated options apart: drop any candidate within `gap` (relative) of one already kept.
function spreadOptions(cands, ref, gap, fmt) {
  const kept = [];
  for (const c of cands) {
    if (!isFinite(c.v)) continue;
    if (kept.some(k => Math.abs(k.v - c.v) < Math.abs(ref) * gap || fmt(k.v) === fmt(c.v))) continue;
    kept.push(c);
  }
  return kept;
}

  const g = genPQVF();

  const exhibit = `<div class="exhibit"><span class="cap">Exhibit · ${esc(g.ind.co)}, ${esc(g.ind.what)}</span>
    <div class="ex-wrap"><table class="ex"><thead><tr><th></th><th>FY2024</th><th>FY2025</th></tr></thead><tbody>
    <tr><td>Units (${esc(ind.unit)}, K)</td><td>${g.Q1.toLocaleString("en-US")}</td><td>${g.Q2.toLocaleString("en-US")}</td></tr>
    <tr><td>Avg price per unit</td><td>${money0(g.P1)}</td><td>${money0(g.P2)}</td></tr>
    <tr><td>Variable cost per unit</td><td>${money0(g.V1)}</td><td>${money0(g.V2)}</td></tr>
    <tr><td>Fixed costs</td><td>${mUSD(g.F1)}</td><td>${mUSD(g.F2)}</td></tr>

    price: { v: g.rev2 - g.rev1, why: `The total revenue change (${mUSD(g.rev2 - g.rev1)}) mixes the price effect with volume.` },
    varcost: { v: -(g.V2 * g.Q2 - g.V1 * g.Q1) / 1000, why: `The change in total variable cost (${mUSD(-(g.V2 * g.Q2 - g.V1 * g.Q1) / 1000)}) mixes the unit-cost effect with volume.` },

    price: `ΔPrice × current units = (${money0(g.P2)} − ${money0(g.P1)}) × ${g.Q2.toLocaleString()}K ≈ ${mUSD(c)}. Every dollar of price falls straight to profit.`,
    varcost: `−ΔUnit cost × current units = −(${money0(g.V2)} − ${money0(g.V1)}) × ${g.Q2.toLocaleString()}K ≈ ${mUSD(c)}.`,

    { ok: false, t: `"Profit is down ${mUSD(-dP)}${sizePct}, and ${sharePhrase} comes from ${DRIVERS[wrong].phrase}. Before asking why, I'd ${DRIVERS[wrong].dig}."` },

  };

const SEG_SETS = [
  { co: "Brightwave Telecom", what: "a broadband provider", dim: "Region", segs: ["Northeast", "Southeast", "Midwest", "West"], line: "Revenue" },
  { co: "Kestrel Foods", what: "a packaged snacks company", dim: "Channel", segs: ["Grocery", "Club stores", "Convenience", "E-commerce"], line: "Revenue" },

const SEG_DIG = {
  "Region": "split it into subscribers versus revenue per subscriber in that region",
  "Channel": "split that channel into outlets or visits, conversion, and basket size",
  "Product": "split it into volume or balances versus price or yield",
  "Country": "split it into store traffic, conversion, and average ticket",

function metricRoundMix() {
  for (let t = 0; t < 50; t++) {
    const s = pick(SEG_SETS);
    const base = s.segs.map(() => roundTo(rnd(40, 220), 1));
    const hit = ri(0, 3);
    const nxt = base.map((b, i) => roundTo(i === hit ? b * (1 - rnd(.22, .4)) : b * (1 + rnd(-.04, .05)), 1));
    const d = nxt.map((n, i) => n - base[i]);
    const tot1 = base.reduce((a, b) => a + b, 0), tot2 = nxt.reduce((a, b) => a + b, 0), dT = tot2 - tot1;
    if (!(dT < -tot1 * .05) || d.some((x, i) => i !== hit && Math.abs(x) * 2.5 > Math.abs(d[hit]))) continue;
    const exhibit = `<div class="exhibit"><span class="cap">Exhibit · ${esc(s.co)}, ${esc(s.what)} · ${esc(s.line)} by ${esc(s.dim.toLowerCase())} ($M)</span>
      <div class="ex-wrap"><table class="ex"><thead><tr><th>${esc(s.dim)}</th><th>FY2024</th><th>FY2025</th></tr></thead><tbody>
      ${s.segs.map((sg, i) => `<tr><td>${esc(sg)}</td><td>${base[i].toFixed(0)}</td><td>${nxt[i].toFixed(0)}</td></tr>`).join("")}
      <tr class="total"><td>Total</td><td>${tot1.toFixed(0)}</td><td>${tot2.toFixed(0)}</td></tr></tbody></table></div></div>`;
    const lineLc = s.line.toLowerCase();
    const dropPct = pct(-dT / tot1, 1);
    const order = shuffle([0, 1, 2, 3]);
    const q1 = {
      skill: "metric", type: "mcq", exhibit,
      title: `${s.line} fell ${dropPct}. Which ${s.dim.toLowerCase()} drives it?`,
      options: order.map(i => s.segs[i]), answer: order.indexOf(hit),
      explain: `${s.segs[hit]} had by far the largest decline. Scan the change in each row, not the levels: the biggest ${s.dim.toLowerCase()} is not always the one that moved. You'll size its share next.`
    };
    const corr = Math.round(d[hit] / dT * 100), wrongDen = Math.round(-d[hit] / tot1 * 100);
    const cands = spreadOptions([{ v: corr, ok: true }, { v: wrongDen }, { v: corr - 15 }, { v: corr + 12 }, { v: corr - 27 }, { v: corr + 24 }].filter(c => c.v > 0), 100, .08, x => x + "%").slice(0, 4);
    const cs = shuffle(cands);
    const q2 = {
      skill: "metric", type: "mcq", exhibit,
      title: `What share of the total ${mUSD(dT, 0)} decline does ${s.segs[hit]} explain?`,
      options: cs.map(c => c.v + "%"), answer: cs.findIndex(c => c.ok),
      explain: `${s.segs[hit]} went from $${base[hit]}M to $${nxt[hit]}M (${mUSD(d[hit], 0)}). ${mUSD(d[hit], 0)} ÷ ${mUSD(dT, 0)} ≈ ${corr}%.${corr > 100 ? " It exceeds 100% because the other rows grew a little." : ""} A common slip is dividing by total ${lineLc} (${wrongDen}%), which answers a different question.${formulaHTML(["shareOfDecline"])}`
    };
    const other = order.filter(i => i !== hit).sort((a, b) => base[b] - base[a])[0];
    const head = `"${s.line} is down ${mUSD(-dT, 0)}, about ${dropPct}, and`;
    const lines = shuffle([
      { ok: true, t: `${head} ${s.segs[hit]} explains roughly ${corr}% of it. I'd ${SEG_DIG[s.dim]} before forming a hypothesis."` },
      { ok: false, t: `${head} ${s.segs[other]} explains roughly ${corr}% of it. I'd ${SEG_DIG[s.dim]} before forming a hypothesis."` },
      { ok: false, t: `${head} ${s.segs[hit]} explains roughly ${wrongDen}% of it. I'd ${SEG_DIG[s.dim]} before forming a hypothesis."` },
      { ok: false, t: `${head} ${s.segs[hit]} explains roughly ${corr}% of it, most likely because a competitor entered, so I'd study their pricing next."` },
    ]);
    const q3 = {
      skill: "metric", type: "mcq", exhibit,
      title: `Pick your next sentence to the interviewer.`, options: lines.map(l => l.t), answer: lines.findIndex(l => l.ok),
      explain: `Size it, locate it, decompose it, and only then hypothesize. The near-misses: one credits ${s.segs[other]}, the largest ${s.dim.toLowerCase()} but not the one that moved; one uses the share of total ${lineLc} (${wrongDen}%) instead of the share of the decline; one gets the numbers right but jumps to a competitor with nothing behind it.`
    };

}

function parsePrompt(t) {
  const tokens = []; let ci = 0; const cons = [];
  const re = /\[\[([^|\]]+)\|([^\]]+)\]\]|(\S+)/g; let m;
  while ((m = re.exec(t))) {
    if (m[1]) {
      const id = ci++; cons.push({ phrase: m[1], why: m[2] });
      m[1].split(/\s+/).forEach(w => tokens.push({ w, c: id }));
    } else tokens.push({ w: m[3], c: -1 });
  }
  // glue punctuation-only tokens? Keep as-is; punctuation stays attached to words.
  return { tokens, cons };
}
function sniperItems(p) {
  const { tokens, cons } = parsePrompt(p.t);
  return [
    { skill: "sniper", type: "tap", tokens, cons, title: "Highlight every descriptor that should change your framework." },
    { skill: "sniper", type: "mcq", title: p.q.title, options: [p.q.a, ...p.q.d], answer: 0, explain: p.q.explain, shuffle: true }
  ];
}

  ["NRR", "Revenue from an existing customer cohort now ÷ a year ago, including expansion and churn"],
  ["ARR", "Annualized value of recurring subscription contracts"],
  ["ARPU", "Revenue ÷ average number of users or subscribers"],
  ["EBITDA", "Earnings before interest, taxes, depreciation & amortization"],
  ["Gross margin", "(Revenue − COGS) ÷ revenue"],
  ["Contribution margin", "(Price − variable cost) per unit, in $ or as a % of price, before fixed costs"],
  ["SG&A", "Selling, general & administrative expenses"],
  ["Operating leverage", "Profit grows faster than revenue because fixed costs stay flat"],
  ["Breakeven", "Fixed costs ÷ contribution margin per unit"],
  ["Payback period", "Upfront investment ÷ annual cash flow it generates"],
  ["CAGR", "Constant annual growth rate that links a start value to an end value"],
  ["Same-store sales", "Revenue growth from locations open at least a year"],
  ["Shrink", "Inventory lost to theft, damage, or spoilage"],
  ["Markdown", "Price reduction to clear inventory"],
  ["Private label", "Retailer-owned store brand sold alongside national brands"],
  ["Trade spend", "Payments from a CPG maker to retailers for promotion and shelf placement"],
  ["RevPAR", "Hotel revenue per available room: occupancy × average daily rate"],
  ["ADR", "Average daily rate paid per occupied hotel room"],
  ["Load factor", "Share of an airline's seat-miles actually filled by passengers"],
  ["RASK / CASK", "Airline revenue / cost per available seat-kilometer"],
  ["Take rate", "Share of gross transaction value a marketplace keeps as revenue"],
  ["GMV", "Total value of goods sold through a marketplace before fees"],
  ["Interchange", "Fee paid by the merchant's bank to the card-issuing bank on a card payment"],
  ["Combined ratio", "Insurer's (claims + expenses) ÷ earned premiums; under 100% means underwriting profit"],
  ["Payer mix", "Hospital revenue split across Medicare, Medicaid, commercial insurers, and self-pay"],
  ["Utilization", "Share of available capacity actually used"],
  ["Capex", "Spending on long-lived assets such as plants, equipment, or networks"],
  ["Opex", "Ongoing operating costs of running the business"],
  ["Working capital", "Current assets minus current liabilities, mostly receivables + inventory − payables"],
  ["Synergies", "Cost or revenue gains from combining two companies beyond what each achieves alone"],
  ["Cannibalization", "A new product taking sales from the company's existing products"],
  ["Burn multiple", "Net cash burned ÷ net new ARR in a startup"],
  ["Unit economics", "Revenue and cost per single unit, customer, or transaction"],

  ["Market share", "Company revenue or volume ÷ total market revenue or volume"],
  ["Run-rate", "Current period's result annualized"],

function lingoItem() {
  const [t, d] = pick(TERMS);
  const others = shuffle(TERMS.filter(x => x[0] !== t)).slice(0, 3);
  const dir = Math.random() < .5;
  const opts = shuffle([[t, d], ...others]);
  return {
    skill: "lingo", type: "mcq", sprint: true, big: true,
    title: dir ? t : d, options: opts.map(o => dir ? o[1] : o[0]), answer: opts.findIndex(o => o[0] === t),
    explain: `${t}: ${d}`
  };
}

function gymStats() {

  for (const r of Store.recs) {

}

  if (ss.length > 1 && /\?$/.test(ss[ss.length - 1]) && ss[ss.length - 1].split(/\s+/).length <= 4) ss = ss.slice(0, -1);
  return ss;
}
const NEG_CALL = /\b(should not|shouldn't|must not|do not|don't|not (?:enter|launch|buy|close|proceed|accept|expand|build|acquire|take)|walk away|hold off|pass on|stay out)\b|^\s*no\b/i;
const callOf = s => (NEG_CALL.test(s) ? "no-go" : "go");
const numsIn = s => (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
function gradeClose(text, c) {
  const ss = sentences(text);
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  const s1 = ss[0] || "", rest = ss.slice(1).join(" ");
  const caseNums = c ? new Set(numsIn(c.facts.join(" ") + " " + c.sit)) : null;
  const used = [...new Set(numsIn(ss.slice(1).join(" ") || text))];
  const matched = caseNums ? used.filter(n => caseNums.has(n)) : used;
  const hedgeRe = /\b(I think|maybe|perhaps|probably|might|could|kind of|sort of|potentially|it depends|consider|explore|look into)\b/gi;
  const verdictWord = /\b(should|shouldn't|recommend|recommends|must|ought to|needs? to)\b/i.test(s1) || /^\s*(yes|no)\b[,:—–-]/i.test(s1);
  const contradicts = /\bshould\s+(?!not\b)/i.test(s1) && /\b(should not|shouldn't)\b/i.test(s1) && !/\b(instead|rather)\b/i.test(s1);
  const noCommit = /\b(don't know|not sure|depends|hard to say|unclear|no easy answer|nuanced)\b/i.test(s1);
  const hedges = s1.match(hedgeRe) || [];
  const risk = /\b(risk|downside|exposure|concern|threat|caveat|danger|vulnerab)/i.test(rest);
  const action = /\b(next step|next,|next we|pilot|test|trial|monitor|track|revisit|secure|launch|brief|validate|negotiate|start|begin|roll out|phase|review|keep|present|automate|exclude)\b/i.test(rest);
  const modelCall = c ? callOf(sentences(c.model)[0]) : null;
  const callMatch = c ? callOf(s1) === modelCall : true;
  const runOn = ss.find(s => s.split(/\s+/).length > 40);

  const checks = [
    { key: "three", label: "Exactly three sentences", ok: ss.length === 3 },
    { key: "verdict", label: "Sentence 1 commits to a clear call", ok: verdictWord && !contradicts && !noCommit && hedges.length === 0 },
    { key: "nums", label: c ? "Reasons use at least two numbers from this case" : "Reasons carry at least two numbers", ok: matched.length >= 2 },
    { key: "risk", label: "Names a risk and a concrete next step", ok: risk && action },
    { key: "call", label: "Your call matches what the numbers support", ok: callMatch },
  ];
  let score = checks.filter(x => x.ok).length;
  const penalties = [];
  if (words > 75) { score--; penalties.push(`${words} words; a partner stops listening around 75`); }
  if (runOn) { score--; penalties.push(`A ${runOn.split(/\s+/).length}-word sentence; split it or cut it`); }
  if (ss.length >= 4) { score = Math.min(score, 2); penalties.push(`${ss.length} sentences caps the score at 2/5`); }
  if (words < 25) { score = Math.min(score, 2); penalties.push("Under 25 words is too thin to carry the reasons"); }
  return { ss, words, checks, hedges, matched, callMatch, call: callOf(s1), modelCall, penalties, score: clamp(score, 0, 5) };
}
function roleLabel(i, n) { return i === 0 ? "Verdict" : i === 1 ? "Reasons" : i === 2 ? "Risk + next step" : "Cut this"; }
function closeBreakdown(g) {
  return `<div class="roles">${g.ss.map((s, i) => {
    const bad = i >= 3 || (i === 0 && !g.checks[1].ok) || (i === 1 && !g.checks[2].ok) || (i === Math.min(2, g.ss.length - 1) && i > 0 && !g.checks[3].ok);
    return `<div class="role ${bad ? "bad" : ""}"><span class="rtag">${roleLabel(i, g.ss.length)}</span><span>${esc(s)}</span></div>`;
  }).join("")}</div>`;
}

function closePickItem(c) {
  const [v, r, k] = sentences(c.model);
  const hedged = v.replace(/\bshould not\b/, "may not want to").replace(/\bshould\b/, "may want to");
  const opts = shuffle([
    { t: c.model, ok: true },
    { t: [r, k, v].join(" "), tag: "buried" },
    { t: [hedged, r, k].join(" "), tag: "hedged" },
    { t: [v, c.vague, k].join(" "), tag: "vague" },
  ]);
  return {
    skill: "close", type: "mcq", context: c.sit, facts: c.facts,
    title: "Partner: \"Give me your recommendation.\" Pick the best close.",
    options: opts.map(o => o.t), answer: opts.findIndex(o => o.ok),
    explain: "All four are three sentences; each wrong one breaks a single rule. One opens with the reasons and buries the call at the end. One hedges the verdict (\"may want to\"). One drops every number from the reasons. The winner leads with the call, backs it with this case's numbers, and ends with a risk and a next step."
  };
}
function closeWriteItem(c) {
  return { skill: "close", type: "text", context: c.sit, facts: c.facts, model: c.model, closeCase: c, title: "Write your three-sentence close." };
}

  markup: { term: "Markup vs. margin", group: "Profitability", formula: "Markup = profit ÷ cost · Margin = profit ÷ price", note: "Same dollars, different denominators. A 50% markup is a 33% margin.", ex: "Cost $60, price $90: markup 50%, margin 33%" },
  pctChange: { term: "Percent change", group: "Growth", formula: "(New − old) ÷ old", note: "Always divide by the starting value.", ex: "80 → 92: 12 ÷ 80 = 15%" },

  cagr: { term: "CAGR", group: "Growth", formula: "CAGR = (end ÷ start)^(1 / years) − 1", note: "The constant yearly rate that turns start into end. Quick estimate: total growth ÷ years, then trim a little for compounding.", ex: "$100M → $150M in 4 yrs: 1.5^(1/4) − 1 ≈ 10.7%" },
  rule72: { term: "Rule of 72", group: "Growth", formula: "Years to double ≈ 72 ÷ growth rate (in %)", note: "Works well for rates between about 4% and 20%.", ex: "9% growth: 72 ÷ 9 = 8 years" },

function quantDrill(c, n = 8) {
  const gens = GENS[c], out = [], seen = new Set();
  let order = [];
  for (let tries = 0; out.length < n && tries < 300; tries++) {
    if (!order.length) order = shuffle(gens.map((_, i) => i));
    const q = gens[order.pop()]();
    if (seen.has(q.title)) continue;
    seen.add(q.title); out.push(q);
  }
  return out;
}

/* ---------- quant formulas and trading terms for the glossary ---------- */
Object.assign(FORMULAS, {
  probCount: { term: "Probability by counting", group: "Probability", formula: "P[event] = favorable outcomes ÷ total outcomes", note: "Only when every outcome is equally likely.", ex: "P[prime on a d6] = 3/6" },
  diceSums: { term: "Two-dice sums", group: "Probability", formula: "Ways to roll sum s = 6 − |s − 7|, out of 36", note: "7 has 6 ways; 2 and 12 have 1 each.", ex: "Sum 10: 6 − 3 = 3 ways → 3/36" },
  union: { term: "Union (or)", group: "Probability", formula: "P[A or B] = P[A] + P[B] − P[A and B]", note: "Subtract the overlap so it isn't counted twice.", ex: "Even or prime on a d6: 3/6 + 3/6 − 1/6 = 5/6" },
  complement: { term: "Complement (not)", group: "Probability", formula: "P[not A] = 1 − P[A]", note: "The fastest route to 'at least one' questions.", ex: "At least one 6 in 4 rolls: 1 − (5/6)⁴ ≈ 0.518" },
  indep: { term: "Independent events", group: "Probability", formula: "P[A and B] = P[A] × P[B]", note: "Only when knowing one tells you nothing about the other.", ex: "Two heads: ½ × ½ = ¼" },
  withoutRepl: { term: "Drawing without replacement", group: "Probability", formula: "P[A then B] = P[A] × P[B | A]", note: "The second draw comes from a smaller deck.", ex: "Two clubs: 13/52 × 12/51 = 1/17" },
  distribution: { term: "Distribution", group: "Probability", formula: "Every value x with its P[X = x]; the P's sum to 1", note: "Uniform means every value is equally likely.", ex: "Min of two dice: P[min = k] = (13 − 2k)/36" },
  maxDice: { term: "Maximum of dice", group: "Probability", formula: "P[max ≤ k] = (k/6)ⁿ, so P[max = k] = (kⁿ − (k−1)ⁿ)/6ⁿ", note: "Work with 'at most' first, then take differences.", ex: "Two dice: P[max = 6] = 11/36" },
  linearTransform: { term: "Linear transform", group: "Probability", formula: "E[aX + b] = a × E[X] + b", note: "Converting units moves the average the same way.", ex: "E[F] = 68°F → E[C] = (68 − 32) × 5/9 = 20°C" },
  ev: { term: "Expected value", group: "Probability", formula: "E[X] = Σ x × P[X = x]", note: "The single most important number about a distribution.", ex: "d6: (1 + … + 6) ÷ 6 = 3.5" },
  linearity: { term: "Linearity of expectation", group: "Probability", formula: "E[X + Y] = E[X] + E[Y]", note: "True even when X and Y are dependent. For independent X, Y: E[XY] = E[X]E[Y].", ex: "Sum of 3 dice: 3 × 3.5 = 10.5" },
  indicator: { term: "Indicator variable", group: "Probability", formula: "1_A = 1 if A happens, else 0; E[1_A] = P[A]", note: "Turns counting problems into sums of probabilities.", ex: "Expected 6s in 12 rolls: 12 × 1/6 = 2" },
  betEV: { term: "Expected payout of a bet", group: "Probability", formula: "E = y + (x − y) × P[win]  (win x, lose → y)", note: "Same as P[win] × x + P[lose] × y.", ex: "Win $20 w.p. 1/4, lose $10: −10 + 30 × ¼ = −$2.50" },
  ciDef: { term: "Confidence interval", group: "Probability", formula: "A range that contains the outcome with a stated probability", note: "Many intervals qualify; often you want the narrowest. Track your hit rate: 90% intervals should miss 1 in 10.", ex: "Uniform 0–100: [5, 95] is a 90% interval" },
  deviation: { term: "Spread: deviation and variance", group: "Probability", formula: "Avg abs deviation = E|X − E[X]| · Variance = E[(X − E[X])²]", note: "Two ways to measure how far outcomes typically land from the average.", ex: "d6: 1.5 and 35/12 ≈ 2.92" },
  condProb: { term: "Conditional probability", group: "Probability", formula: "P[A | B] = P[A and B] ÷ P[B]", note: "Shrink to the outcomes where B is true, then ask how many have A.", ex: "P[5 | roll ≥ 4] = (1/6) ÷ (1/2) = 1/3" },
  bayes: { term: "Bayes' rule", group: "Probability", formula: "P[A | B] = P[B | A] × P[A] ÷ P[B]", note: "Turns 'how likely is the evidence given A' into 'how likely is A given the evidence'.", ex: "Prior 10%, hit 90%, false alarm 20%: 0.09 ÷ 0.27 = 1/3" },
  geometric: { term: "Expected tries to first success", group: "Probability", formula: "E = 1 ÷ p", note: "From the recursion E = 1 + (1 − p)E.", ex: "Roll until a 6: 6 tries" },
  headRuns: { term: "Heads in a row", group: "Probability", formula: "Expected flips for n heads in a row = 2^(n+1) − 2", note: "Eₙ = 2Eₙ₋₁ + 2, starting from E₁ = 2.", ex: "3 in a row: 14 flips" },
  recursion: { term: "Recursion for expectations", group: "Probability", formula: "E = cost of one step + Σ P[next state] × E[from that state]", note: "Works when the process is memoryless: after a failure you're back where you started.", ex: "Flip until heads: E = 1 + ½E → 2" },
  edge: { term: "Edge on a trade", group: "Trading", formula: "Bought: E[value] − price · Sold: price − E[value]", note: "Positive edge means you expect to profit on average.", ex: "Buy a d6 contract at 3: edge = 3.5 − 3 = 0.5" },
  pnl: { term: "P&L at settlement", group: "Trading", formula: "Bought: size × (settlement − price) · Sold: size × (price − settlement)", note: "Realized P&L is noisy; edge is what you earn on average.", ex: "Bought 10 at 3, settles 5: +$20" },
  condFill: { term: "Value given a fill", group: "Trading", formula: "Lifted at offer a: E[X | X > a] · Hit at bid b: E[X | X < b]", note: "Against an informed trader, assume they only trade when it's good for them.", ex: "Card 1–10, offer 6: E[X | X > 6] = 8.5" },

/* ============================================================
   Session building
   ============================================================ */
let S = null;            // active session
let screen = "home";
let resultsAt = 0;
let timerId = null;
let bag = {};            // non-repeating draws
function draw(name, arr) {
  if (!bag[name] || !bag[name].length) bag[name] = shuffle(arr.map((_, i) => i));
  return arr[bag[name].pop()];
}

function skillStats() {
  const out = {};
  for (const k of Object.keys(SKILLS)) out[k] = { items: [], sessions: [] };
  for (const r of Store.recs) {
    const per = {};
    for (const it of r.items) {
      if (!out[it.s]) continue;
      out[it.s].items.push(it);
      (per[it.s] = per[it.s] || []).push(it);
    }
    for (const k in per) {
      const arr = per[k];
      out[k].sessions.push({ ts: r.ts, acc: arr.reduce((a, b) => a + b.ok, 0) / arr.length, ms: arr.reduce((a, b) => a + b.ms, 0) / arr.length });
    }
  }
  for (const k in out) {
    const o = out[k], recent = o.items.slice(-40), n = recent.length;
    o.n = o.items.length;
    o.acc = n ? recent.reduce((a, b) => a + b.ok, 0) / n : null;
    o.ms = n ? recent.reduce((a, b) => a + b.ms, 0) / n : null;
    o.fast = n ? recent.filter(i => i.ms <= SKILLS[k].target).length / n : 0;
    o.mastery = n ? Math.round((0.7 * o.acc + 0.3 * o.fast) * 100 * Math.min(1, n / 20)) : 0;
    o.status = !n ? "new" : o.mastery >= 85 ? "mast" : o.mastery >= 60 ? "prog" : "work";
  }
  return out;
}
function weakest(stats) {
  const ks = Object.keys(SKILLS).filter(k => k !== "quant");   // the quant course stays opt-in
  const untried = ks.filter(k => stats[k].n === 0);
  if (untried.length) return untried[0];
  return ks.slice().sort((a, b) => stats[a].mastery - stats[b].mastery)[0];
}

function itemsFor(skill, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (skill === "bucket") out.push(bucketItem(draw("bucket", BUCKETS)));
    else if (skill === "lingo") out.push({ ...lingoItem(), sprint: false });
    else if (skill === "math") out.push({ ...mathItem(), sprint: false });
    else if (skill === "problem") out.push(problemItem());
    else if (skill === "close") out.push(closePickItem(draw("close", CLOSES)));
    else if (skill === "sniper") out.push(...sniperItems(draw("prompt", PROMPTS)));
    else if (skill === "metric") out.push(...metricRound());
  }
  return out;
}

function buildQueue(mode) {
  if (mode === "metric") return [...metricRound(), ...metricRound(), ...metricRound()];
  if (mode.startsWith("q:")) return quantDrill(mode.slice(2));
  if (mode === "qmix") {
    const qs = quantStats(), pool = QORDER.filter(k => k !== "interview" && qs.con[k].status !== "new");
    const ks = pool.length >= 2 ? pool : QORDER.slice(0, 4);
    const out = [], seen = new Set();
    for (let t = 0; out.length < 10 && t < 200; t++) { const k = pick(ks), g = pick(GENS[k])(); if (!seen.has(g.title)) { seen.add(g.title); out.push(g); } }
    return out;
  }
  if (mode === "qmm") return [...shuffle(CONTRACTS).slice(0, 5).map(c => marketQ("markets", c)), marketQ("adverse", pick(CONTRACTS.filter(x => !x.big)), true)];
  if (mode === "sniper") return [0, 1, 2].flatMap(() => sniperItems(draw("prompt", PROMPTS)));
  if (mode === "bucket") return Array.from({ length: 8 }, () => bucketItem(draw("bucket", BUCKETS)));
  if (mode === "problem") return Array.from({ length: 4 }, problemItem);
  if (mode === "close") { const a = draw("close", CLOSES), b = draw("close", CLOSES), c = draw("close", CLOSES), d = draw("close", CLOSES); return [closePickItem(a), closeWriteItem(b), closePickItem(c), closeWriteItem(d)]; }
  if (mode === "daily") {
    const w = weakest(skillStats());
    const q = [...itemsFor("metric", 1), ...itemsFor("bucket", 2), ...itemsFor("math", 2), ...itemsFor("sniper", 1), ...itemsFor("lingo", 2), ...itemsFor("close", 1), ...itemsFor(w, w === "metric" || w === "sniper" ? 1 : 2)];
    return q;
  }
  return [];
}

function startSession(mode, opts = {}) {
  stopConfetti();
  if (mode.startsWith("m:") && !opts.skipIntro && !introSeen(mode.slice(2))) return renderIntro(mode.slice(2));
  const sprint = mode === "math" || mode === "boss" ? 90 : mode === "lingo" || mode === "weak" || mode.startsWith("m:") ? 60 : 0;
  S = { mode, queue: sprint ? [] : buildQueue(mode), idx: 0, items: [], combo: 0, bestCombo: 0, xp: 0, sprint, endAt: 0, qStart: 0, answered: false, results: [], weak: opts.weak || null, gs: gymStats(), startTs: Date.now(), reask: [],
    bosses: mode === "boss" ? opts.bosses.map(k => ({ k, hp: 3 })) : null };
  if (sprint) { S.endAt = Date.now() + sprint * 1000; S.queue.push(sprintItem()); }
  renderGame();
  if (sprint) tickTimer();
  scrollTo(0, 0);
}

function current() { return S.queue[S.idx]; }
function sprintItem() {
  const m = S.mode, prev = S.queue[S.queue.length - 1];
  // A missed fact comes back 2–3 cards later (immediate error correction)
  if (S.reask.length && S.reask[0].due <= S.queue.length) { const r = S.reask.shift(); return { ...catItem(r.c, r.f), reask: true }; }
  if (m === "boss") {
    let alive = S.bosses.filter(b => b.hp > 0);
    if (alive.length > 1 && prev) alive = alive.filter(b => b.k !== prev.c + "|" + prev.f);
    const [c, f] = pick(alive).k.split("|"); return catItem(c, f);
  }
  const gen = () => {
    if (m === "lingo") return lingoItem();
    if (m === "math") return mathItem(null, S.gs);
    if (m === "weak") { const [c, f] = pick(S.weak).split("|"); return catItem(c, f); }
    const c = m.slice(2); return catItem(c, pickFact(c, S.gs));
  };
  let q = gen(); if (prev && q.title === prev.title) q = gen();
  return q;
}

function record(ok, extra) {
  const q = current(), ms = Date.now() - S.qStart;
  const okv = clamp(+ok, 0, 1);
  const full = okv >= .75;
  S.combo = full ? S.combo + 1 : 0;
  S.bestCombo = Math.max(S.bestCombo, S.combo);
  const target = q.tms || SKILLS[q.skill].target;
  const gained = Math.round(okv * 10 + (full && ms <= target ? 5 : 0) + (full ? Math.min(S.combo, 10) : 0));
  S.xp += gained;
  const it = { s: q.skill, ok: +okv.toFixed(2), ms };
  if (q.c) { it.c = q.c; it.f = q.f; }
  S.items.push(it);
  S.results.push({ q, ok: okv, ms, extra });
  updateHud(gained);
  return { okv, full, ms, gained };
}

function next() {
  if (!S) return;
  if (S.sprint) {
    if (Date.now() >= S.endAt) return finish();
    S.queue.push(sprintItem());
  }
  S.idx++;
  if (S.idx >= S.queue.length) return finish();
  renderQuestion();
}

function totals() {
  const xp = Store.recs.reduce((a, r) => a + (r.xp || 0), 0);
  const days = [...new Set(Store.recs.map(r => dayKey(r.ts)))];
  let streak = 0; const d = new Date();
  const has = k => days.includes(k);
  if (!has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  const today = Store.recs.filter(r => dayKey(r.ts) === dayKey(Date.now()));
  const items = Store.recs.reduce((a, r) => a + r.items.length, 0);
  return { xp, streak, todayCount: today.length, todayXp: today.reduce((a, r) => a + r.xp, 0), items, sessions: Store.recs.length };
}

function sparkSVG(points, color, labels) {
  const w = 96, h = 28, pad = 3;
  if (points.length < 2) return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="${pad}" x2="${w - pad}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line)" stroke-dasharray="3 3"/></svg>`;
  const xs = i => pad + i * (w - 2 * pad) / (points.length - 1);
  const ys = v => h - pad - v * (h - 2 * pad);
  const d = points.map((v, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join("");
  const area = d + `L${xs(points.length - 1).toFixed(1)},${h - pad}L${pad},${h - pad}Z`;
  const last = points[points.length - 1];
  const dots = points.map((v, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="6" fill="transparent"><title>Session ${i + 1}: ${labels ? labels[i] : pct(v)}</title></circle>`).join("");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Last ${points.length} sessions"><path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xs(points.length - 1).toFixed(1)}" cy="${ys(last).toFixed(1)}" r="3" fill="${color}"/>${dots}</svg>`;
}

const STATUS_LABEL = { none: "Not started", untimed: "Needs timed check", below: "Below standard", close: "Almost there", ready: "Case-ready" };
const STATUS_PILL = { none: "new", untimed: "new", below: "work", close: "prog", ready: "mast" };
const FACT_LABEL = {
  up: "% increase", down: "% decrease", base: "Back out base", stack: "Stacked %", ppts: "Points vs %",
  margin: "Margin", breakeven: "Breakeven", contrib: "Contribution", payback: "Payback", markup: "Price for margin",
  "72": "Rule of 72", "2yr": "2-yr compound", "3yr": "3-yr compound", cagr: "Back out CAGR"
};
const factLabel = f => FACT_LABEL[f] || f;

function gymCard() {
  const gs = gymStats(), ready = CAT_KEYS.filter(k => gs.cats[k].status === "ready").length, f = focusList(gs)[0];
  return `<button class="mode" type="button" data-gym>
    <span class="row"><h3>Math Gym</h3><span class="tag">Math</span></span>
    <p>Ten timed drills from times tables to CAGR, each with a correct-per-minute standard, per-fact heat maps, and a pick for what to drill next.</p>
    <span class="gymdots" aria-hidden="true">${CAT_KEYS.map(k => `<i class="gd ${gs.cats[k].status}" title="${esc(MATH_CATS[k].name)}: ${STATUS_LABEL[gs.cats[k].status]}"></i>`).join("")}</span>
    <span class="meta"><span><b class="num">${ready}</b>/${CAT_KEYS.length} at case-ready standard</span><span>${f ? "Focus: " + esc(MATH_CATS[f].name) : "Every standard met"}</span></span>
  </button>`;
}

function focusReason(gs, k) {
  const o = gs.cats[k], C = MATH_CATS[k];
  if (o.status === "none") return C.tier === 1 ? "Not started. Tier 1 facts come first because every case calculation is built from them." : "Not started. Take a 60-second check to get a baseline.";
  if (o.status === "untimed") return `${o.n} answered in mixed practice (${pct(o.acc)} accurate), but no timed check yet. One 60-second check sets your rate.`;
  const sf = slowFacts(gs, k, 3).map(x => factLabel(x.f));
  return `${o.cpm.toFixed(1)} correct/min against a standard of ${C.cpm} · ${pct(o.acc)} accurate (standard ${pct(C.acc)})${sf.length ? ` · slowest: ${sf.join(", ")}` : ""}`;
}

function renderGym() {
  S = null; clearInterval(timerId); screen = "gym";
  const gs = gymStats(), focus = focusList(gs), ready = CAT_KEYS.filter(k => gs.cats[k].status === "ready").length;
  const f0 = focus[0];

  const row = k => {
    const C = MATH_CATS[k], o = gs.cats[k];
    const max = C.cpm * 1.25, w = o.cpm == null ? 0 : Math.min(100, o.cpm / max * 100);
    const checks = o.checks.slice(-8);
    return `<tr>
      <td><b>${esc(C.name)}</b><div class="muted small">${esc(C.blurb)}</div></td>
      <td><span class="pill ${STATUS_PILL[o.status]}">${STATUS_LABEL[o.status]}</span></td>
      <td><div class="cpmcell"><div class="cpmbar" title="${o.cpm == null ? "No timed check yet" : o.cpm.toFixed(1) + " correct/min"}; standard ${C.cpm}"><i class="${o.status}" style="width:${w}%"></i><span class="tick"></span></div><span class="num">${o.cpm == null ? "—" : o.cpm.toFixed(1)}<span class="muted"> / ${C.cpm}</span></span></div></td>
      <td class="num">${o.best == null ? "—" : o.best.toFixed(1)}</td>
      <td class="num">${o.acc == null ? "—" : pct(o.acc)}<span class="muted"> / ${pct(C.acc)}</span></td>
      <td class="num">${o.med == null ? "—" : (o.med / 1000).toFixed(1) + "s"}<span class="muted"> / ${(60 / C.cpm).toFixed(1)}s</span></td>
      <td>${sparkSVG(checks.map(c => clamp(c.cpm / max, 0, 1)), "var(--accent)", checks.map(c => c.cpm.toFixed(1) + " correct/min"))}</td>
      <td class="acts"><button class="btn sm primary" type="button" data-cat="${k}">Drill</button><button class="linkbtn" type="button" data-strat="${k}" aria-expanded="false">How</button></td>
    </tr>
    <tr class="strat-row" id="strat-${k}" hidden><td colspan="8">${strategyHTML(C)}</td></tr>`;
  };
  const tierRows = t => CAT_KEYS.filter(k => MATH_CATS[k].tier === t).map(row).join("");

  // Times-table heat map
  let heat = `<span class="hh">×</span>`;
  for (let b = 2; b <= 12; b++) heat += `<span class="hh">${b}</span>`;
  for (let a = 2; a <= 12; a++) {
    heat += `<span class="hh">${a}</span>`;
    for (let b = 2; b <= 12; b++) {
      const key = Math.min(a, b) + "×" + Math.max(a, b), fs = factState(gs, "mult", key);
      heat += `<span class="hc ${fs.st}" title="${a} × ${b} = ${a * b}${fs.n ? ` · avg ${(fs.ms / 1000).toFixed(1)}s · ${pct(1 - fs.miss)} recent accuracy · ${fs.n} tries` : " · not seen yet"}">${fs.n ? (fs.ms / 1000).toFixed(1) : ""}</span>`;
    }
  }
  const panels = CAT_KEYS.filter(k => k !== "mult").map(k => {
    const C = MATH_CATS[k];
    return `<div class="fpanel"><div class="row"><h3>${esc(C.name)}</h3><button class="linkbtn" type="button" data-cat="${k}">Drill</button></div>
      <div class="fchips">${C.facts().map(f => { const fs = factState(gs, k, f); return `<span class="fchip ${fs.st}" title="${esc(factLabel(f))}${fs.n ? ` · avg ${(fs.ms / 1000).toFixed(1)}s vs ${(fs.tms / 1000).toFixed(1)}s standard · ${pct(1 - fs.miss)} recent accuracy · ${fs.n} tries` : " · not seen yet"}">${esc(factLabel(f))}</span>`; }).join("")}</div></div>`;
  }).join("");

  // Weakest facts across every category
  const weak = [];
  for (const k of CAT_KEYS) for (const f of MATH_CATS[k].facts()) { const fs = factState(gs, k, f); if (fs.st === "slow" || fs.st === "miss") weak.push({ k, f, ...fs }); }
  weak.sort((a, b) => b.score - a.score);
  const top = weak.slice(0, 12);
  const weakTable = top.length ? `<div class="ptable-wrap"><table class="ptable" style="min-width:460px"><thead><tr><th>Fact</th><th>Category</th><th>Avg time / standard</th><th>Recent accuracy</th><th>Tries</th></tr></thead><tbody>
    ${top.map(x => `<tr><td><b>${esc(factLabel(x.f))}</b></td><td class="muted">${esc(MATH_CATS[x.k].name)}</td><td class="num">${(x.ms / 1000).toFixed(1)}s <span class="muted">/ ${(x.tms / 1000).toFixed(1)}s</span></td><td class="num ${x.st === "miss" ? "neg" : ""}">${pct(1 - x.miss)}</td><td class="num">${x.n}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="muted">No slow or missed facts yet. Take a few timed checks and the ones that cost you time will show up here.</p>`;

  $("#view").innerHTML = `
  <div class="wrap" style="gap:22px">
    <div class="gamebar"><div class="left"><button class="btn ghost" type="button" id="gymBack">← Dashboard</button><h2>Math Gym</h2></div>
      <span class="chip"><b class="num">${ready}</b>&nbsp;/ ${CAT_KEYS.length} case-ready</span></div>

    <section class="hero">
      <div class="card shift">
        <span class="eyebrow">Drill this next</span>
        ${f0 ? `<h2>${esc(MATH_CATS[f0].name)}</h2><p>${esc(focusReason(gs, f0))}</p>
        <button class="btn primary" type="button" data-cat="${f0}">Start 60-second check</button>` : `<h2>Every standard met</h2><p>Keep it sharp with mixed sprints and Problem Solving. Fluency fades without practice.</p>`}
      </div>
      <div class="card wrap" style="gap:10px">
        <span class="eyebrow">Up next</span>
        ${focus.slice(1, 4).map(k => `<div class="nextup"><span class="pill ${STATUS_PILL[gs.cats[k].status]}">${STATUS_LABEL[gs.cats[k].status]}</span><button class="linkbtn" type="button" data-cat="${k}">${esc(MATH_CATS[k].name)}</button></div>`).join("") || `<p class="muted">Nothing queued.</p>`}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto">
          <button class="btn" type="button" data-mode="math">Mixed sprint · 90 s</button>
          <button class="btn" type="button" data-mode="problem">Problem Solving</button>
        </div>
      </div>
    </section>

    <section class="card wrap" style="gap:12px">
      <div class="section-head"><h2>Fluency ladder</h2><span class="muted small">Rate = median of your last three 60-second checks · bar tick = standard</span></div>
      <div class="ptable-wrap"><table class="ptable ladder">
        <thead><tr><th>Category</th><th>Status</th><th>Correct / min</th><th>Best</th><th>Accuracy</th><th>Median time</th><th>Last 8 checks</th><th></th></tr></thead>
        <tbody>
          <tr class="tier"><td colspan="8">Tier 1 · Fact fluency, the reflexes</td></tr>${tierRows(1)}
          <tr class="tier"><td colspan="8">Tier 2 · Case operations, the moves</td></tr>${tierRows(2)}
        </tbody></table></div>
    </section>

    <section class="card wrap" style="gap:14px">
      <div class="section-head"><h2>Fact tables</h2>
        <span class="legend"><span><i class="fchip fast"></i>At standard</span><span><i class="fchip slow"></i>Slow</span><span><i class="fchip miss"></i>Missed recently</span><span><i class="fchip none"></i>Not seen</span></span></div>
      <div class="facts-layout">
        <div class="wrap" style="gap:8px"><div class="row"><h3>Times tables · avg seconds</h3><button class="linkbtn" type="button" data-cat="mult">Drill</button></div>
          <div class="heat" role="img" aria-label="Times table heat map; the weakest facts are also listed in the table below">${heat}</div>
          <p class="muted small">Standard: ${(60 / MATH_CATS.mult.cpm).toFixed(1)}s per fact. Drills automatically serve your slow and missed cells more often.</p></div>
        <div class="fpanels">${panels}</div>
      </div>
    </section>

    <section class="card wrap" style="gap:12px">
      <div class="section-head"><h2>Weakest facts</h2>${top.length ? `<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" type="button" id="bossBtn">Boss battle · top ${Math.min(5, top.length)}</button><button class="btn sm" type="button" id="weakBtn">Drill all ${top.length} · 60 s</button></span>` : ""}</div>
      ${top.length ? `<p class="muted small">Boss battle: your ${Math.min(5, top.length)} weakest facts each have 3 HP. A correct answer under the standard time is a hit; a miss heals the boss. Beat all of them inside 90 seconds.</p>` : ""}
      ${weakTable}
    </section>

    <section class="card wrap standards" style="gap:10px">
      <h2>How the standards are set</h2>
      <p><b>Tier 1, fact fluency.</b> Research on basic-fact fluency finds that learners who answer about 30–40 facts correctly per minute keep progressing on harder multi-step work, while those under about 30 tend to stall (Miller &amp; Heward, 1992, as summarized by Rocket Math). Precision-teaching aims for written facts run higher, 60–100 digits per minute. Typing is slower than writing, so the standard here is 30 per minute for single facts, scaled down for longer answers: 25 for fractions, 20 for squares, 15 for 2-digit × 1-digit. Accuracy must be at least 95%.</p>
      <p><b>Tier 2, case operations.</b> No firm publishes a number. Prep sources agree on about 5 seconds for a simple percentage and under 10 seconds per calculation step, with no single step over 20 seconds (Hacking the Case Interview, Management Consulted). That works out to 12 per minute for one-step moves, 8–10 for division and % change, and 6 for two-step moves like breakeven or compounding. Accuracy must be at least 90%, within 1–3% of the exact figure.</p>
      <p><b>Why tier 1 comes first.</b> Fluency research treats basic facts as components of composite skills: when the components become automatic, the composite skills improve faster and hold up better under pressure (Binder, 1996). In a case, that means working memory goes to the logic instead of to 7 × 8. The focus pick weights tier 1 higher for this reason.</p>
      <p><b>How it's measured.</b> A category's rate comes only from its own 60-second checks: the median of your last three, so one bad run doesn't swing it. Every answer, including mixed sprints and Daily Shift items, feeds the per-fact tables and accuracy.</p>

function quantStats() {
  const out = {};
  for (const k of QORDER) out[k] = { items: [] };
  const cal = [];
  for (const r of Store.recs) for (const it of r.items) {
    if (it.s !== "quant" || !out[it.c]) continue;
    out[it.c].items.push(it);
    if (it.f === "cal") cal.push(it);
  }
  for (const k of QORDER) {

    o.status = o.n >= 10 && o.acc >= .85 ? "mast" : o.n ? "prog" : lessonRead(k) ? "read" : "new";
  }
  const hits = cal.filter(i => i.hit).length;
  return { con: out, cal: { n: cal.length, hits } };
}

function readPair() {
  const lo = parseNum($("#lowIn").value), hi = parseNum($("#highIn").value);
  if (isNaN(lo) || isNaN(hi)) return { err: "Enter a number in both boxes." };
  if (lo >= hi) return { err: "The first number must be lower than the second." };
  return { lo, hi };
}
function pairError(msg) { $("#fbslot").innerHTML = `<p class="hint" style="color:var(--bad)">${esc(msg)}</p>`; }
function answerMarket() {
  if (S.answered) return;
  const q = current(), c = q.contract, p = readPair();
  if (p.err) return pairError(p.err);
  S.answered = true;
  const { lo: bid, hi: off } = p, ev = c.ev, n = q.size, fmt = x => (c.big ? money(x) : (x < 0 ? "−$" : "$") + Math.abs(x).toFixed(2));
  const width = off - bid, inside = bid < ev && off > ev;
  let ok, verdict;
  if (!inside) {
    ok = 0;
    verdict = bid >= ev ? `Your bid of ${fmt(bid)} is at or above fair value (${fmt(ev)}). A sharp trader sells you ${n} and expects to make ${fmt(n * (bid - ev))} off you.`
      : `Your offer of ${fmt(off)} is at or below fair value (${fmt(ev)}). A sharp trader buys ${n} from you and expects to make ${fmt(n * (ev - off))} off you.`;
  } else {
    ok = width <= c.w ? 1 : width <= 2 * c.w ? .6 : .3;
    verdict = `Fair value is ${fmt(ev)}, and your market brackets it with a width of ${fmt(width)}. ${ok === 1 ? "Tight enough that people will trade with you." : ok === .6 ? `A bit wide (aim for about ${fmt(c.w)}): fewer trades come your way.` : `Too wide (aim for about ${fmt(c.w)}): you're safe, but almost nobody trades, so you earn little.`}`;
  }
  // Simulate one counterparty and one settlement
  const settle = c.sample();
  let sim;
  if (q.informed) {
    const buys = settle > off, sells = settle < bid;
    const pnl = buys ? n * (off - settle) : sells ? n * (settle - bid) : 0;
    sim = buys ? `They saw ${c.big ? money(settle) : settle} and lifted your offer: you sold ${n} at ${fmt(off)}. P&L ${fmt(pnl)}.` : sells ? `They saw ${c.big ? money(settle) : settle} and hit your bid: you bought ${n} at ${fmt(bid)}. P&L ${fmt(pnl)}.` : `They saw ${c.big ? money(settle) : settle}, inside your market, and passed. P&L $0.`;
    sim += " An informed trader only trades when it hurts you, so every fill you get here loses money. That's adverse selection: conditional on being filled, the value has moved against you. Quote wider (or not at all) against people who know more.";
  } else {
    // A mispriced quote gets picked off on the wrong side; a fair one trades either way at random
    const buy = !inside ? off <= ev : Math.random() < .5, price = buy ? off : bid;
    const pnl = buy ? n * (off - settle) : n * (settle - bid), edge = buy ? n * (off - ev) : n * (ev - bid);
    sim = `A trader ${buy ? `lifted your offer: you sold ${n} at ${fmt(price)}` : `hit your bid: you bought ${n} at ${fmt(price)}`}. It settled at ${c.big ? money(settle) : settle}: P&L ${fmt(pnl)}. Your expected edge on that trade was ${fmt(edge)}${inside ? "; over many trades, edge is what you earn, while single results are noise" : ""}.`;
  }
  const r = record(ok);
  $("#lowIn").disabled = $("#highIn").disabled = true;
  showFeedback(ok, `<div>Your market: <b class="num">${fmt(bid)} at ${fmt(off)}, ${n} up</b>.</div><div>${verdict}</div>
    <div class="muted">${esc(c.how)}</div>
    <div class="sim">${sim}</div>${formulaHTML(q.informed ? ["condFill", "edge"] : ["edge", "pnl"])}
    <span class="quip">+${r.gained} XP</span>`);
}
function answerCI() {
  if (S.answered) return;
  const q = current(), p = readPair();
  if (p.err) return pairError(p.err);
  S.answered = true;
  const { lo, hi } = p, a = q.answer;
  const hit = lo <= a && a <= hi;
  const tooWide = hit && (lo > 0 ? hi / lo > 20 : hi > 5 * a);
  const ok = hit ? (tooWide ? .5 : 1) : 0;
  const r = record(ok);
  S.items[S.items.length - 1].hit = hit ? 1 : 0;
  const session = S.items.filter(i => i.f === "cal"), sh = session.filter(i => i.hit).length;
  $("#lowIn").disabled = $("#highIn").disabled = true;
  showFeedback(ok, `<div>Answer: <b class="num">${a.toLocaleString("en-US")}</b>${q.note ? ` <span class="muted">· ${esc(q.note)}</span>` : ""}</div>
    <div>Your range: <span class="num">${lo.toLocaleString("en-US")} to ${hi.toLocaleString("en-US")}</span> · ${hit ? (tooWide ? "Contains it, but so wide it barely says anything. Half credit." : "Contains it.") : "Missed. If this keeps happening, your ranges are too narrow."}</div>
    <div class="muted">This session: ${sh} of ${session.length} intervals contained the answer. Well calibrated 90% intervals hit about 9 in 10.</div>
    ${formulaHTML(["ciDef"])}<span class="quip">+${r.gained} XP</span>`);
}
