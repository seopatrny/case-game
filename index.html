<title>Case Cracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a steering-committee "deck" turned arcade. Cool graph-paper ground, white slide cards,
   cobalt for action, highlighter yellow for the things you must not miss. */
:root {
  --bg: #eaeef5;
  --grid: #dde3ee;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --ink: #131a2c;
  --muted: #586379;
  --line: #d3dae7;
  --accent: #2b45f0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8ff;
  --hl: #ffe45c;
  --hl-ink: #131a2c;
  --good: #10794a;
  --good-soft: #def3e8;
  --bad: #c0352e;
  --bad-soft: #fbe3e1;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --grid: #151c2f; --surface: #161d30; --surface-2: #1c2439; --ink: #e8ecf6; --muted: #9ba5bc;
    --line: #2a3352; --accent: #7d8dff; --accent-ink: #0d1220; --accent-soft: #232c55; --hl: #e9c92c; --hl-ink: #131a2c;
    --good: #4cc48b; --good-soft: #15342a; --bad: #ff7d72; --bad-soft: #3d1d1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --grid: #151c2f; --surface: #161d30; --surface-2: #1c2439; --ink: #e8ecf6; --muted: #9ba5bc;
  --line: #2a3352; --accent: #7d8dff; --accent-ink: #0d1220; --accent-soft: #232c55; --hl: #e9c92c; --hl-ink: #131a2c;
  --good: #4cc48b; --good-soft: #15342a; --bad: #ff7d72; --bad-soft: #3d1d1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .word:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
.brand mark { background: var(--hl); color: var(--hl-ink); padding: 0 .2em; border-radius: 3px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .82rem; font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on .dot { background: var(--good); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
kbd { font-family: var(--mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface-2); }

/* hero */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.hero > * { min-width: 0; }
.hero.duo { grid-template-columns: 1fr 1fr; }
.rank-card { display: flex; flex-direction: column; gap: 12px; }
.rank-title { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 4.6vw, 2.5rem); letter-spacing: -.02em; }
.xpbar { height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
.stats-row { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.shift { background: var(--ink); color: var(--bg); border-color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.shift .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.shift h2 { font-size: 1.5rem; }
.shift p { color: color-mix(in srgb, var(--bg) 82%, transparent); font-size: .92rem; }
.shift .btn.primary { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); align-self: flex-start; margin-top: auto; }

/* modes */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; transition: transform .12s ease, border-color .12s; }
.mode:hover { transform: translateY(-2px); border-color: var(--accent); }
.mode .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.hl { background: var(--hl); color: var(--hl-ink); }
.mode p { font-size: .88rem; color: var(--muted); }
.mode .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; }
.mode-math { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-math > .mode { min-width: 0; }

/* progress */
.ptable-wrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 560px; }
.ptable th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ptable tr:last-child td { border-bottom: 0; }
.mbar { width: 110px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.mbar.done i { background: var(--good); }
.pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.work { background: var(--bad-soft); color: var(--bad); }
.pill.prog { background: var(--accent-soft); color: var(--accent); }
.pill.mast { background: var(--good-soft); color: var(--good); }
.spark { display: block; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; color: var(--muted); }
.badge.got { border-style: solid; border-color: var(--hl); background: color-mix(in srgb, var(--hl) 22%, var(--surface)); color: var(--ink); font-weight: 600; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.backup { display: flex; flex-direction: column; gap: 8px; }
.backup textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: .75rem; }

/* game */
.gamebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.gamebar .left { display: flex; align-items: center; gap: 12px; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.ok { background: var(--good); }
.pip.part { background: var(--hl); }
.pip.no { background: var(--bad); }
.pip.cur { background: var(--accent); }
.hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.combo { font-family: var(--display); font-weight: 800; color: var(--accent); min-width: 3.5em; text-align: right; }
.combo.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.35); } }
.timer { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.stage { display: flex; flex-direction: column; gap: 16px; }
.qtitle { font-family: var(--display); font-weight: 700; font-size: clamp(1.15rem, 3.2vw, 1.45rem); line-height: 1.25; }
.prompt-text { font-size: 1rem; }
.exhibit { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.exhibit .cap { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ex-wrap { overflow-x: auto; }
.ex { border-collapse: collapse; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .88rem; min-width: 320px; width: 100%; }
.ex th, .ex td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); }
.ex th:first-child, .ex td:first-child { text-align: left; font-family: var(--body); }
.ex th { font-size: .75rem; color: var(--muted); font-weight: 600; }
.ex tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--mono); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-top: 2px; flex: none; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.numrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.numrow input { flex: 1 1 180px; min-width: 0; font-family: var(--mono); font-size: 1.3rem; padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.hint { font-size: .8rem; color: var(--muted); }
.fb { border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.fb.ok { border-color: var(--good); }
.fb.no { border-color: var(--bad); }
.fb .verdict { font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--good); }
.fb.no .verdict { color: var(--bad); }
.fb ul { margin: 0; padding-left: 1.2em; }
.fb .quip { font-style: italic; color: var(--muted); font-size: .88rem; }
.nextrow { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.flash { font-family: var(--display); font-weight: 800; font-size: 1.1rem; min-height: 1.6em; }
.flash.ok { color: var(--good); }
.flash.no { color: var(--bad); }
.sprint-q { font-family: var(--mono); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; text-align: center; padding: 18px 6px; line-height: 1.3; }
.lingo-q { font-family: var(--display); font-size: clamp(1.25rem, 4vw, 1.6rem); font-weight: 700; text-align: center; padding: 10px 4px; }

/* sniper */
.snipe { font-size: 1.12rem; line-height: 2.05; }
.word { display: inline; padding: 2px 3px; border-radius: 3px; cursor: pointer; border: 0; background: none; font: inherit; color: inherit; }
.word:hover { background: var(--accent-soft); }
.word.on { background: var(--hl); color: var(--hl-ink); }
.word.miss { box-shadow: inset 0 -3px 0 var(--bad); }
.word.fp { text-decoration: line-through; text-decoration-color: var(--bad); }
.word.hit { background: var(--hl); color: var(--hl-ink); box-shadow: inset 0 -3px 0 var(--good); }
.why { display: grid; gap: 6px; }
.why div { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 10px; font-size: .9rem; }
.why b { background: var(--hl); color: var(--hl-ink); padding: 0 6px; border-radius: 3px; align-self: start; font-weight: 600; }

/* close */
.facts { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
textarea.close-in { width: 100%; min-height: 140px; font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
.meter { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.meter b { font-family: var(--mono); color: var(--ink); }
.meter .over { color: var(--bad); }
.rubric { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rubric li { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; }
.rubric .m { font-family: var(--mono); font-weight: 700; flex: none; width: 1.2em; }
.rubric .y { color: var(--good); }
.rubric .n { color: var(--bad); }
.model { border-left: 3px solid var(--accent); padding-left: 12px; }

/* bridge chart */
.bridge { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: 120px 1fr 74px; gap: 8px; align-items: center; font-size: .82rem; }
.btrack { position: relative; height: 16px; }
.btrack::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.bbar { position: absolute; top: 2px; height: 12px; border-radius: 3px; }
.bbar.neg { background: var(--bad); }
.bbar.pos { background: var(--good); }
.brow .v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* results */
.results { display: flex; flex-direction: column; gap: 16px; }
.big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.big > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.big b { display: block; font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.big span { font-size: .75rem; color: var(--muted); }
.delta-up { color: var(--good); font-weight: 700; }
.delta-dn { color: var(--bad); font-weight: 700; }
.rankup { background: var(--hl); color: var(--hl-ink); border-radius: 8px; padding: 12px 14px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.review { display: grid; gap: 6px; font-size: .88rem; }
.review div { display: flex; gap: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

@media (max-width: 680px) {
  .hero, .hero.duo { grid-template-columns: 1fr; }
  .mode-math { grid-template-columns: 1fr; }
  .big { grid-template-columns: repeat(2, 1fr); }
  .brow { grid-template-columns: 92px 1fr 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

      <span class="chip" id="streakChip">🔥 0-day streak</span>
      <span class="chip" id="syncChip"><span class="dot"></span><span>Saved on this device</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const roundTo = (x, step) => Math.round(x / step) * step;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

function fmtNum(x) {
  const a = Math.abs(x), s = x < 0 ? "−" : "";
  const trim = v => (+v.toPrecision(3)).toString();
  if (a >= 1e12) return s + trim(a / 1e12) + "T";
  if (a >= 1e9) return s + trim(a / 1e9) + "B";
  if (a >= 1e6) return s + trim(a / 1e6) + "M";
  if (a >= 1e4) return s + trim(a / 1e3) + "K";
  if (a >= 100) return s + Math.round(a).toLocaleString("en-US");
  return s + (+a.toPrecision(3)).toString();
}
const money = x => (x < 0 ? "−$" : "$") + fmtNum(Math.abs(x));
const mUSD = (x, d = 1) => (x < 0 ? "−$" : "$") + Math.abs(x).toFixed(d) + "M";

// "2.4m", "$1,200", "12%", "3.5b", "840k", "1.2 bn"
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim().toLowerCase().replace(/[$,\s]/g, "").replace(/−/g, "-");
  if (!s) return NaN;
  let mult = 1;
  const m = s.match(/(trillion|billion|million|thousand|bn|mm|tn|t|b|m|k|%|x|yrs?|years?)$/);
  if (m) {
    const u = m[1];
    mult = { t: 1e12, tn: 1e12, trillion: 1e12, b: 1e9, bn: 1e9, billion: 1e9, m: 1e6, mm: 1e6, million: 1e6, k: 1e3, thousand: 1e3 }[u] || 1;
    s = s.slice(0, -u.length);
  }
  const v = parseFloat(s);
  return isNaN(v) ? NaN : v * mult;
}

/* ============================================================
   Storage: records live in the artifact database when available,
   with a localStorage mirror so the game also works offline.
   ============================================================ */
const LS_KEY = "caseCracker.v1";
const Store = {
  recs: [], col: null,
  load() {
    try { const r = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); this.recs = Array.isArray(r) ? r : []; } catch (e) { this.recs = []; }
  },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.recs)); } catch (e) {} },
  async connect() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      const snap = await this.col.get();
      const remote = snap.docs.map(d => d.data()).filter(r => r && r.id && r.ts);
      const ids = new Set(remote.map(r => r.id));
      const localOnly = this.recs.filter(r => !ids.has(r.id));
      this.recs = remote.concat(localOnly).sort((a, b) => a.ts - b.ts);
      this.saveLocal();
      setSync(true);
      for (const r of localOnly) { try { await this.col.doc(r.id).set(r); } catch (e) {} }
      if (screen === "home") renderHome();
    } catch (e) { /* stay local */ }
  },
  async add(r) {
    this.recs.push(r); this.saveLocal();
    if (this.col) { try { await this.col.doc(r.id).set(r); } catch (e) {} }
  },
  async importAll(list) {
    const ids = new Set(this.recs.map(r => r.id));

const INDUSTRIES = [
  { co: "Ridgeline Roasters", what: "a specialty coffee roaster", unit: "bags", P: [14, 22], rev: [60, 180], vr: [.5, .62] },
  { co: "Aerlinn", what: "a European regional airline", unit: "seats sold", P: [95, 170], rev: [300, 900], vr: [.55, .68] },
  { co: "Stackwise", what: "a mid-market SaaS company", unit: "seat licenses", P: [320, 620], rev: [80, 260], vr: [.18, .3] },
  { co: "Pulse Fitness", what: "a US fitness chain", unit: "memberships", P: [420, 720], rev: [120, 400], vr: [.35, .5] },
  { co: "Halcyon Audio", what: "a consumer electronics maker", unit: "headphones", P: [90, 220], rev: [150, 600], vr: [.55, .66] },
  { co: "Torrent Industrial", what: "an industrial pump manufacturer", unit: "pumps", P: [2200, 5200], rev: [100, 350], vr: [.52, .64] },
  { co: "Greenleaf Grocers", what: "a regional grocery chain", unit: "baskets", P: [38, 62], rev: [500, 1400], vr: [.7, .78] },
  { co: "Northgate Hotels", what: "a US midscale hotel group", unit: "room-nights", P: [110, 190], rev: [200, 700], vr: [.32, .45] },
];
const DRIVERS = {
  volume: { label: "Volume (units sold)", phrase: "lower volume", dig: "check whether the volume loss is concentrated in one segment, channel, or region" },
  price: { label: "Average price", phrase: "lower average price", dig: "split the price drop into list-price cuts, discounting, and mix shift" },
  varcost: { label: "Variable cost per unit", phrase: "higher variable cost per unit", dig: "break unit cost into materials, labor, and logistics to see which component moved" },
  fixed: { label: "Fixed costs", phrase: "higher fixed costs", dig: "see which fixed line (SG&A, rent, D&A) grew and whether it was a one-off" },
};

function genPQVF() {
  for (let tries = 0; tries < 60; tries++) {
    const ind = pick(INDUSTRIES);
    const main = pick(Object.keys(DRIVERS));
    const P1 = roundTo(rnd(ind.P[0], ind.P[1]), ind.P[0] > 1000 ? 50 : ind.P[0] > 80 ? 5 : 0.5);
    const rev1 = rnd(ind.rev[0], ind.rev[1]);
    const Q1 = roundTo(rev1 * 1000 / P1, 10);                 // thousands of units
    const V1 = roundTo(P1 * rnd(ind.vr[0], ind.vr[1]), P1 > 1000 ? 10 : P1 > 80 ? 1 : 0.1);
    const contrib1 = Q1 * (P1 - V1) / 1000;
    const F1 = roundTo(contrib1 * rnd(.55, .72), 0.5);
    const noise = () => 1 + rnd(-.02, .02);
    let Q2 = Q1 * noise(), P2 = P1 * noise(), V2 = V1 * noise(), F2 = F1 * noise();
    if (main === "volume") Q2 = Q1 * (1 - rnd(.12, .24));
    if (main === "price") P2 = P1 * (1 - rnd(.06, .12));
    if (main === "varcost") V2 = V1 * (1 + rnd(.1, .2));
    if (main === "fixed") F2 = F1 * (1 + rnd(.18, .35));
    Q2 = roundTo(Q2, 10); P2 = roundTo(P2, P1 > 1000 ? 50 : P1 > 80 ? 1 : 0.1); V2 = roundTo(V2, P1 > 1000 ? 10 : P1 > 80 ? 1 : 0.1); F2 = roundTo(F2, 0.5);
    const pr1 = contrib1 - F1, pr2 = Q2 * (P2 - V2) / 1000 - F2;
    const eff = {
      price: Q2 * (P2 - P1) / 1000,
      volume: (Q2 - Q1) * (P1 - V1) / 1000,
      varcost: -Q2 * (V2 - V1) / 1000,
      fixed: -(F2 - F1),
    };
    const others = Object.keys(eff).filter(k => k !== main);
    const ok = eff[main] < 0 && others.every(k => Math.abs(eff[k]) * 2.5 < Math.abs(eff[main])) && pr2 < pr1 * .92 && pr1 > 2;
    if (!ok) continue;
    return { ind, main, P1, P2, Q1, Q2, V1, V2, F1, F2, pr1, pr2, eff, rev1: Q1 * P1 / 1000, rev2: Q2 * P2 / 1000 };
  }
  return genPQVF();
}

function bridgeHTML(eff, labels, total) {
  const max = Math.max(...Object.values(eff).map(Math.abs), 0.1);
  const rows = Object.keys(eff).map(k => {
    const v = eff[k], w = Math.abs(v) / max * 50;
    const style = v < 0 ? `right:50%;width:${w}%` : `left:50%;width:${w}%`;
    return `<div class="brow"><span>${esc(labels[k])}</span><div class="btrack"><span class="bbar ${v < 0 ? "neg" : "pos"}" style="${style}" title="${esc(labels[k])}: ${mUSD(v)}"></span></div><span class="v">${v >= 0 ? "+" : ""}${mUSD(v)}</span></div>`;
  }).join("");
  return `<div class="bridge" role="table" aria-label="Profit bridge">${rows}<div class="brow"><b>Total change</b><span></span><b class="v">${mUSD(total)}</b></div></div>`;
}

function pqvfDecimals(x) { return x >= 1000 ? 0 : x >= 80 ? 0 : 2; }
function metricRoundPQVF() {
  const g = genPQVF();
  const { ind, main } = g;
  const d = pqvfDecimals(g.P1);
  const exhibit = `<div class="exhibit"><span class="cap">Exhibit · ${esc(g.ind.co)}, ${esc(g.ind.what)}</span>
    <div class="ex-wrap"><table class="ex"><thead><tr><th></th><th>FY2024</th><th>FY2025</th></tr></thead><tbody>
    <tr><td>Units (${esc(ind.unit)}, K)</td><td>${g.Q1.toLocaleString("en-US")}</td><td>${g.Q2.toLocaleString("en-US")}</td></tr>
    <tr><td>Avg price per unit</td><td>$${g.P1.toFixed(d)}</td><td>$${g.P2.toFixed(d)}</td></tr>
    <tr><td>Variable cost per unit</td><td>$${g.V1.toFixed(d)}</td><td>$${g.V2.toFixed(d)}</td></tr>
    <tr><td>Fixed costs</td><td>${mUSD(g.F1)}</td><td>${mUSD(g.F2)}</td></tr>
    <tr class="total"><td>Operating profit</td><td>${mUSD(g.pr1)}</td><td>${mUSD(g.pr2)}</td></tr>
    </tbody></table></div></div>`;
  const dP = g.pr2 - g.pr1, dPct = dP / g.pr1;
  const labels = { volume: "Volume", price: "Price", varcost: "Var. cost/unit", fixed: "Fixed costs" };
  const bridge = bridgeHTML(g.eff, labels, dP);
  const share = g.eff[main] / dP;

  const keys = shuffle(Object.keys(DRIVERS));
  const q1 = {
    skill: "metric", type: "mcq", exhibit,
    title: `Operating profit fell from ${mUSD(g.pr1)} to ${mUSD(g.pr2)}. Which line explains most of the drop?`,
    options: keys.map(k => DRIVERS[k].label), answer: keys.indexOf(main),
    explain: `Isolate each driver while holding the others constant. ${DRIVERS[main].label} accounts for ${mUSD(g.eff[main])} of the ${mUSD(dP)} change (${pct(share)}).${bridge}`
  };

  const correct = g.eff[main];
  let trap;
  if (main === "volume") trap = (g.Q2 - g.Q1) * g.P1 / 1000;           // revenue, not contribution
  else if (main === "price") trap = (g.P2 - g.P1) * g.Q1 / 1000 * 0.5;
  else if (main === "varcost") trap = -(g.V2 - g.V1) * g.Q1 / 1000 * 1.9;
  else trap = -(g.F2 - g.F1) * 2;
  const cand = [correct, trap, correct * .45, correct * 1.7];
  const seen = new Set(); const mopts = [];
  for (const c of cand) { const s = mUSD(c); if (!seen.has(s)) { seen.add(s); mopts.push({ s, ok: c === correct }); } }
  while (mopts.length < 4) { const s = mUSD(correct * rnd(2, 2.6)); if (!seen.has(s)) { seen.add(s); mopts.push({ s, ok: false }); } }
  const ms = shuffle(mopts);
  const howCalc = {
    volume: `ΔUnits × prior unit contribution = (${g.Q2.toLocaleString()}K − ${g.Q1.toLocaleString()}K) × ($${g.P1.toFixed(d)} − $${g.V1.toFixed(d)}) ≈ ${mUSD(correct)}. Multiplying by price instead gives the revenue loss (${mUSD(trap)}), not the profit loss.`,
    price: `ΔPrice × current units = ($${g.P2.toFixed(d)} − $${g.P1.toFixed(d)}) × ${g.Q2.toLocaleString()}K ≈ ${mUSD(correct)}. Every dollar of price falls straight to profit.`,
    varcost: `−ΔUnit cost × current units = −($${g.V2.toFixed(d)} − $${g.V1.toFixed(d)}) × ${g.Q2.toLocaleString()}K ≈ ${mUSD(correct)}.`,
    fixed: `Fixed costs rose from ${mUSD(g.F1)} to ${mUSD(g.F2)}, a ${mUSD(correct)} hit to profit, one for one.`,
  }[main];
  const q2 = {
    skill: "metric", type: "mcq", exhibit,
    title: `Quantify it. What is the profit impact of the ${DRIVERS[main].label.toLowerCase()} change?`,
    options: ms.map(o => o.s), answer: ms.findIndex(o => o.ok), explain: howCalc
  };

  const wrong = pick(Object.keys(DRIVERS).filter(k => k !== main));
  const lines = [
    { ok: true, t: `"Profit is down ${mUSD(-dP)}, about ${pct(-dPct)}, and roughly ${Math.round(share * 10) * 10}% of that comes from ${DRIVERS[main].phrase}. Before asking why, I'd ${DRIVERS[main].dig}."` },
    { ok: false, t: `"My hypothesis is that new competitors are taking customers, so I'd start by mapping the competitive landscape and their value propositions."` },
    { ok: false, t: `"I'd structure this into revenue, costs, market, and competition, and work through each bucket in turn."` },
    { ok: false, t: `"Profit is down ${mUSD(-dP)}, mostly because of ${DRIVERS[wrong].phrase}, so I'd dig into what's driving that first."` },
  ];
  const ls = shuffle(lines);
  const q3 = {
    skill: "metric", type: "mcq", exhibit,
    title: `Interviewer: "So, what's going on here?" Pick your opening line.`,
    options: ls.map(l => l.t), answer: ls.findIndex(l => l.ok),
    explain: `The winning line states the size of the problem, attributes it to one driver with a share, and only then moves to "why." Jumping to competitors or reciting buckets skips the number the interviewer is waiting for.`
  };
  return [q1, q2, q3];
}

const SEG_SETS = [
  { co: "Brightwave Telecom", what: "a broadband provider", dim: "Region", segs: ["Northeast", "Southeast", "Midwest", "West"], line: "Revenue" },
  { co: "Kestrel Foods", what: "a packaged snacks company", dim: "Channel", segs: ["Grocery", "Club stores", "Convenience", "E-commerce"], line: "Revenue" },
  { co: "Meridian Bank", what: "a US regional bank", dim: "Product", segs: ["Mortgages", "Commercial loans", "Credit cards", "Auto loans"], line: "Net interest income" },
  { co: "Atlas Apparel", what: "a European apparel retailer", dim: "Country", segs: ["Germany", "France", "UK", "Nordics"], line: "Revenue" },
  { co: "Clearpath Health", what: "a specialty pharma company", dim: "Product", segs: ["Oncology", "Immunology", "Cardio", "Generics"], line: "Revenue" },
];
const SEG_DIG = {
  "Region": "split it into subscribers versus revenue per subscriber in that region",
  "Channel": "split that channel into store count, traffic, and basket size",
  "Product": "split it into balances or volume versus yield or price",
  "Country": "split it into store traffic, conversion, and average ticket",

function metricRoundMix() {
  for (let t = 0; t < 50; t++) {
    const s = pick(SEG_SETS);
    const base = s.segs.map(() => roundTo(rnd(40, 220), 1));
    const hit = ri(0, 3);
    const nxt = base.map((b, i) => roundTo(i === hit ? b * (1 - rnd(.22, .4)) : b * (1 + rnd(-.04, .05)), 1));
    const d = nxt.map((n, i) => n - base[i]);
    const tot1 = base.reduce((a, b) => a + b, 0), tot2 = nxt.reduce((a, b) => a + b, 0), dT = tot2 - tot1;
    if (!(dT < -tot1 * .05) || d.some((x, i) => i !== hit && Math.abs(x) * 2.5 > Math.abs(d[hit]))) continue;
    const exhibit = `<div class="exhibit"><span class="cap">Exhibit · ${esc(s.co)}, ${esc(s.what)} · ${esc(s.line)} by ${esc(s.dim.toLowerCase())} ($M)</span>
      <div class="ex-wrap"><table class="ex"><thead><tr><th>${esc(s.dim)}</th><th>FY2024</th><th>FY2025</th></tr></thead><tbody>
      ${s.segs.map((sg, i) => `<tr><td>${esc(sg)}</td><td>${base[i].toFixed(0)}</td><td>${nxt[i].toFixed(0)}</td></tr>`).join("")}
      <tr class="total"><td>Total</td><td>${tot1.toFixed(0)}</td><td>${tot2.toFixed(0)}</td></tr></tbody></table></div></div>`;
    const share = d[hit] / dT;
    const order = shuffle([0, 1, 2, 3]);
    const q1 = {
      skill: "metric", type: "mcq", exhibit,
      title: `${s.line} fell ${pct(-dT / tot1)}. Which ${s.dim.toLowerCase()} drives it?`,
      options: order.map(i => s.segs[i]), answer: order.indexOf(hit),
      explain: `${s.segs[hit]} went from $${base[hit]}M to $${nxt[hit]}M (${mUSD(d[hit], 0)}), against a total change of ${mUSD(dT, 0)}. Scan the deltas, not the levels: the biggest segment is not always the one that moved.`
    };
    const corr = Math.round(share * 100);
    const choices = shuffle([...new Set([corr, Math.round(-d[hit] / tot1 * 100), Math.round(corr * .6), Math.min(99, Math.round(corr * 1.3) + 3)])].slice(0, 4));
    while (choices.length < 4) choices.push(corr + 7 * choices.length);
    const q2 = {
      skill: "metric", type: "mcq", exhibit,
      title: `What share of the total ${mUSD(dT, 0)} decline does ${s.segs[hit]} explain?`,
      options: choices.map(c => c + "%"), answer: choices.indexOf(corr),
      explain: `${mUSD(d[hit], 0)} ÷ ${mUSD(dT, 0)} ≈ ${corr}%. It can exceed 100% when other segments grew. A common slip is dividing by total revenue (${Math.round(-d[hit] / tot1 * 100)}%), which answers a different question.`
    };
    const lines = shuffle([
      { ok: true, t: `"${s.line} is down ${mUSD(-dT, 0)}, about ${pct(-dT / tot1)}, and ${s.segs[hit]} explains roughly ${corr}% of it. I'd ${SEG_DIG[s.dim]} before forming a hypothesis."` },
      { ok: false, t: `"It sounds like a market-wide slowdown. I'd look at macro trends and customer sentiment first."` },
      { ok: false, t: `"${s.segs[hit]} is clearly the problem, probably because of a new competitor. Can we talk about their strategy?"` },
      { ok: false, t: `"I'd like to understand the company's history, products, and customers before looking at the numbers."` },
    ]);
    const q3 = {
      skill: "metric", type: "mcq", exhibit,
      title: `Pick your next sentence to the interviewer.`, options: lines.map(l => l.t), answer: lines.findIndex(l => l.ok),
      explain: `Size it, locate it, decompose it, and only then hypothesize. The third option names the right segment but jumps to a cause with no number behind it.`
    };
    return [q1, q2, q3];
  }
  return metricRoundPQVF();
}

function parsePrompt(t) {
  const tokens = []; let ci = 0; const cons = [];
  const re = /\[\[([^|\]]+)\|([^\]]+)\]\]|(\S+)/g; let m;
  while ((m = re.exec(t))) {
    if (m[1]) {
      const id = ci++; cons.push({ phrase: m[1], why: m[2] });
      m[1].split(/\s+/).forEach(w => tokens.push({ w, c: id }));
    } else tokens.push({ w: m[3], c: -1 });
  }
  // glue punctuation-only tokens? Keep as-is; punctuation stays attached to words.
  return { tokens, cons };
}
function sniperItems(p) {
  const { tokens, cons } = parsePrompt(p.t);
  return [
    { skill: "sniper", type: "tap", tokens, cons, title: "Highlight every descriptor that should change your framework." },
    { skill: "sniper", type: "mcq", title: p.q.title, options: p.q.options, answer: p.q.answer, explain: p.q.explain, shuffle: true }
  ];
}

  ["EBITDA", "Earnings before interest, taxes, depreciation & amortization"],
  ["Gross margin", "(Revenue − COGS) ÷ revenue"],
  ["Contribution margin", "Price minus variable cost per unit, before fixed costs"],
  ["SG&A", "Selling, general & administrative expenses"],
  ["Operating leverage", "Profit grows faster than revenue because fixed costs stay flat"],
  ["Breakeven", "Fixed costs ÷ contribution margin per unit"],

function sentences(text) {
  const t = text.trim().replace(/\s+/g, " ");
  if (!t) return [];
  // Protect decimals and common abbreviations
  const prot = t.replace(/(\d)\.(\d)/g, "$1§$2").replace(/\b(e\.g|i\.e|vs|approx|U\.S|etc)\./gi, m => m.replace(/\./g, "§"));
  return prot.split(/(?<=[.!?])\s+/).map(s => s.replace(/§/g, ".")).filter(s => s.trim().length > 2);
}
function gradeClose(text) {
  const ss = sentences(text);
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  const first = ss[0] || "";
  const checks = [
    { label: "Exactly three sentences", ok: ss.length === 3, w: 2 },
    { label: "Answer first: sentence 1 is a clear verdict", ok: /\b(should|shouldn't|should not|recommend|go ahead|do not|don't|yes|no)\b/i.test(first) && !/\b(depends|it's hard|complicated|consider(ing)?|explore)\b/i.test(first), w: 1 },
    { label: "Reasons carry at least two numbers", ok: (text.match(/\d+(\.\d+)?/g) || []).length >= 2, w: 1 },
    { label: "Ends with a risk and a next step", ok: /\b(risk|next step|pilot|test|monitor|track|revisit|watch|mitigat)/i.test(ss[ss.length - 1] || ""), w: 1 },
  ];
  const hedges = (text.match(/\b(I think|maybe|perhaps|probably|kind of|sort of|might|could potentially|it depends)\b/gi) || []);
  let score = checks.reduce((a, c) => a + (c.ok ? c.w : 0), 0);
  if (ss.length === 2 || ss.length === 4) score += 1, checks[0].partial = true;
  if (hedges.length) score -= 1;
  if (words > 90) score -= 1;
  return { ss, words, checks, hedges, score: clamp(score, 0, 5) };
}
function closePickItem(c) {
  const long = "To recap, we looked at the market, the company's economics, and the competitive landscape. " + c.model + " We could also run additional analyses on customer segments. Overall, it's a nuanced picture with several moving parts.";
  const opts = shuffle([{ t: c.model, ok: true }, { t: c.weak, ok: false }, { t: long, ok: false }]);
  return {
    skill: "close", type: "mcq", context: c.sit, facts: c.facts,
    title: "Partner: \"Give me your recommendation.\" Pick the best close.",
    options: opts.map(o => o.t), answer: opts.findIndex(o => o.ok),
    explain: "The winner is exactly three sentences: verdict, reasons with numbers, risk plus next step. The long version contains the right answer but buries it between a recap and filler. The weak one never commits and has no numbers."
  };
}
function closeWriteItem(c) {
  return { skill: "close", type: "text", context: c.sit, facts: c.facts, model: c.model, title: "Write your three-sentence close." };
}

/* ============================================================
   Session building
   ============================================================ */
let S = null;            // active session
let screen = "home";
let timerId = null;
let bag = {};            // non-repeating draws
function draw(name, arr) {
  if (!bag[name] || !bag[name].length) bag[name] = shuffle(arr.map((_, i) => i));
  return arr[bag[name].pop()];
}

function skillStats() {
  const out = {};
  for (const k of Object.keys(SKILLS)) out[k] = { items: [], sessions: [] };
  for (const r of Store.recs) {
    const per = {};
    for (const it of r.items) {
      if (!out[it.s]) continue;
      out[it.s].items.push(it);
      (per[it.s] = per[it.s] || []).push(it);
    }
    for (const k in per) {
      const arr = per[k];
      out[k].sessions.push({ ts: r.ts, acc: arr.reduce((a, b) => a + b.ok, 0) / arr.length, ms: arr.reduce((a, b) => a + b.ms, 0) / arr.length });
    }
  }
  for (const k in out) {
    const o = out[k], recent = o.items.slice(-40), n = recent.length;
    o.n = o.items.length;
    o.acc = n ? recent.reduce((a, b) => a + b.ok, 0) / n : null;
    o.ms = n ? recent.reduce((a, b) => a + b.ms, 0) / n : null;
    o.fast = n ? recent.filter(i => i.ms <= SKILLS[k].target).length / n : 0;
    o.mastery = n ? Math.round((0.7 * o.acc + 0.3 * o.fast) * 100 * Math.min(1, n / 20)) : 0;
    o.status = !n ? "new" : o.mastery >= 85 ? "mast" : o.mastery >= 60 ? "prog" : "work";
  }
  return out;
}
function weakest(stats) {
  const ks = Object.keys(SKILLS);
  const untried = ks.filter(k => stats[k].n === 0);
  if (untried.length) return untried[0];
  return ks.slice().sort((a, b) => stats[a].mastery - stats[b].mastery)[0];
}

function itemsFor(skill, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (skill === "bucket") out.push(bucketItem(draw("bucket", BUCKETS)));
    else if (skill === "lingo") out.push({ ...lingoItem(), sprint: false });
    else if (skill === "math") out.push({ ...mathItem(), sprint: false });
    else if (skill === "problem") out.push(problemItem());
    else if (skill === "close") out.push(closePickItem(draw("close", CLOSES)));
    else if (skill === "sniper") out.push(...sniperItems(draw("prompt", PROMPTS)));
    else if (skill === "metric") out.push(...metricRound());
  }
  return out;
}

function buildQueue(mode) {
  if (mode === "metric") return [...metricRound(), ...metricRound(), ...metricRound()];
  if (mode === "sniper") return [0, 1, 2].flatMap(() => sniperItems(draw("prompt", PROMPTS)));
  if (mode === "bucket") return Array.from({ length: 8 }, () => bucketItem(draw("bucket", BUCKETS)));
  if (mode === "problem") return Array.from({ length: 4 }, problemItem);
  if (mode === "close") { const a = draw("close", CLOSES), b = draw("close", CLOSES), c = draw("close", CLOSES), d = draw("close", CLOSES); return [closePickItem(a), closeWriteItem(b), closePickItem(c), closeWriteItem(d)]; }
  if (mode === "daily") {
    const w = weakest(skillStats());
    const q = [...itemsFor("metric", 1), ...itemsFor("bucket", 2), ...itemsFor("math", 2), ...itemsFor("sniper", 1), ...itemsFor("lingo", 2), ...itemsFor("close", 1), ...itemsFor(w, w === "metric" || w === "sniper" ? 1 : 2)];
    return q;
  }
  return [];
}

function startSession(mode) {
  const sprint = mode === "math" ? 90 : mode === "lingo" ? 60 : 0;
  S = { mode, queue: sprint ? [] : buildQueue(mode), idx: 0, items: [], combo: 0, bestCombo: 0, xp: 0, sprint, endAt: 0, qStart: 0, answered: false, results: [] };
  if (sprint) { S.endAt = Date.now() + sprint * 1000; S.queue.push(mode === "math" ? mathItem() : lingoItem()); }
  renderGame();
  if (sprint) tickTimer();
  scrollTo(0, 0);
}

function current() { return S.queue[S.idx]; }

function record(ok, extra) {
  const q = current(), ms = Date.now() - S.qStart;
  const okv = clamp(+ok, 0, 1);
  const full = okv >= .75;
  S.combo = full ? S.combo + 1 : 0;
  S.bestCombo = Math.max(S.bestCombo, S.combo);
  const target = SKILLS[q.skill].target;
  const gained = Math.round(okv * 10 + (full && ms <= target ? 5 : 0) + (full ? Math.min(S.combo, 10) : 0));
  S.xp += gained;
  S.items.push({ s: q.skill, ok: +okv.toFixed(2), ms });
  S.results.push({ q, ok: okv, ms, extra });
  updateHud(gained);
  return { okv, full, ms, gained };
}

function next() {
  if (!S) return;
  if (S.sprint) {
    if (Date.now() >= S.endAt) return finish();
    S.queue.push(S.mode === "math" ? mathItem() : lingoItem());
  }
  S.idx++;
  if (S.idx >= S.queue.length) return finish();
  renderQuestion();
}

function totals() {
  const xp = Store.recs.reduce((a, r) => a + (r.xp || 0), 0);
  const days = [...new Set(Store.recs.map(r => dayKey(r.ts)))];
  let streak = 0; const d = new Date();
  const has = k => days.includes(k);
  if (!has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  const today = Store.recs.filter(r => dayKey(r.ts) === dayKey(Date.now()));
  const items = Store.recs.reduce((a, r) => a + r.items.length, 0);
  return { xp, streak, todayCount: today.length, todayXp: today.reduce((a, r) => a + r.xp, 0), items, sessions: Store.recs.length };
}

function sparkSVG(points, color) {
  const w = 96, h = 28, pad = 3;
  if (points.length < 2) return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="${pad}" x2="${w - pad}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line)" stroke-dasharray="3 3"/></svg>`;
  const xs = i => pad + i * (w - 2 * pad) / (points.length - 1);
  const ys = v => h - pad - v * (h - 2 * pad);
  const d = points.map((v, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join("");
  const area = d + `L${xs(points.length - 1).toFixed(1)},${h - pad}L${pad},${h - pad}Z`;
  const last = points[points.length - 1];
  const dots = points.map((v, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="6" fill="transparent"><title>Session ${i + 1}: ${pct(v)}</title></circle>`).join("");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Accuracy over last ${points.length} sessions"><path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xs(points.length - 1).toFixed(1)}" cy="${ys(last).toFixed(1)}" r="3" fill="${color}"/>${dots}</svg>`;
}

  });
  $("#restoreBtn").addEventListener("click", async () => {
    try { const n = await Store.importAll(JSON.parse($("#backupText").value)); $("#backupMsg").textContent = `Restored ${n} session${n === 1 ? "" : "s"}.`; setTimeout(renderHome, 900); }
    catch (e) { $("#backupMsg").textContent = "That text isn't a valid backup. Paste the full text you copied earlier."; }
  });
}

/* ============================================================
   Rendering: game
   ============================================================ */
function renderGame() {
  screen = "game";
  const m = MODES[S.mode];
  $("#view").innerHTML = `
  <div class="wrap" style="gap:14px">
    <div class="gamebar">
      <div class="left"><button class="btn ghost" type="button" id="quitBtn" aria-label="Quit session">✕ Quit</button><h2>${m.name}</h2></div>
      <div class="hud"><span class="combo" id="combo"></span><span class="timer" id="timer" ${S.sprint ? "" : "hidden"}></span><span class="chip"><b class="num" id="xpHud">0</b>&nbsp;XP</span></div>
    </div>
    <div class="pips" id="pips" ${S.sprint ? "hidden" : ""}></div>
    <section class="card stage" id="stage"></section>
    <p class="hint">Keys: <kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Enter</kbd> submit / next · <kbd>Esc</kbd> quit</p>
  </div>`;
  $("#quitBtn").addEventListener("click", () => (S.items.length ? finish() : renderHome()));
  renderQuestion();
}

function updateHud(gained) {
  $("#xpHud").textContent = S.xp;
  const c = $("#combo");
  if (S.combo >= 2) { c.textContent = `×${S.combo} combo`; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
  else c.textContent = "";
  renderPips();
}
function renderPips() {
  if (S.sprint) return;
  $("#pips").innerHTML = S.queue.map((_, i) => {
    const r = S.results[i];
    const cls = r ? (r.ok >= .75 ? "ok" : r.ok >= .4 ? "part" : "no") : i === S.idx ? "cur" : "";
    return `<span class="pip ${cls}"></span>`;
  }).join("");
}
function tickTimer() {
  clearInterval(timerId);
  const el = $("#timer");
  const f = () => {
    if (!S || !S.sprint) return clearInterval(timerId);
    const left = Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 10);
    if (left <= 0) { clearInterval(timerId); finish(); }
  };
  f(); timerId = setInterval(f, 250);
}

function contextBlock(q) {
  let h = "";
  if (q.context) h += `<span class="eyebrow">${esc(q.context)}</span>`;
  if (q.facts) h += `<div class="exhibit"><span class="cap">Case facts</span><ul class="facts">${q.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
  if (q.exhibit) h += q.exhibit;
  return h;
}

function renderQuestion() {
  const q = current();
  S.answered = false; S.qStart = Date.now();
  renderPips();
  const st = $("#stage");
  if (q.type === "mcq") {
    if (q.shuffle && !q._shuf) {
      const order = shuffle(q.options.map((_, i) => i));
      q.options = order.map(i => q.options[i]); q.answer = order.indexOf(q.answer); q._shuf = true;
    }
    st.innerHTML = `${contextBlock(q)}
      <div class="${q.big ? "lingo-q" : "qtitle"}">${q.big ? esc(q.title) : q.title}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fbslot"></div>`;
    st.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMCQ(+b.dataset.i)));
  } else if (q.type === "num") {
    st.innerHTML = `${contextBlock(q)}
      <div class="${q.sprint ? "sprint-q" : "qtitle"}">${esc(q.title)}</div>
      <form class="numrow" id="numForm" autocomplete="off">
        <input id="numIn" inputmode="text" placeholder="${q.unit === "%" ? "e.g. 12.5%" : q.unit === "yrs" ? "e.g. 3.5" : "e.g. 2.4m"}" aria-label="Your answer">
        <button class="btn primary" type="submit">Submit</button>
      </form>
      ${q.sprint ? `<div class="flash" id="flash"></div>` : `<p class="hint">Within ${Math.round(q.tol * 100)}% counts. Suffixes k / m / b work.</p>`}
      <div id="fbslot"></div>`;
    const inp = $("#numIn"); inp.focus();
    $("#numForm").addEventListener("submit", e => { e.preventDefault(); answerNum(inp.value); });
  } else if (q.type === "tap") {
    q.sel = new Set();
    st.innerHTML = `<span class="eyebrow">Case prompt</span>
      <div class="qtitle">${q.title}</div>
      <div class="snipe" id="snipe">${q.tokens.map((t, i) => `<button type="button" class="word" data-i="${i}">${esc(t.w)}</button>`).join(" ")}</div>
      <div class="nextrow"><span class="hint" id="selCount">0 words highlighted</span><button class="btn primary" type="button" id="lockBtn">Lock in</button></div>
      <div id="fbslot"></div>`;
    st.querySelectorAll(".word").forEach(b => b.addEventListener("click", () => {
      if (S.answered) return;
      const i = +b.dataset.i; q.sel.has(i) ? q.sel.delete(i) : q.sel.add(i); b.classList.toggle("on");
      $("#selCount").textContent = `${q.sel.size} word${q.sel.size === 1 ? "" : "s"} highlighted`;
    }));
    $("#lockBtn").addEventListener("click", answerTap);
  } else if (q.type === "text") {
    st.innerHTML = `${contextBlock(q)}
      <div class="qtitle">${q.title}</div>
      <p class="hint">Verdict → two reasons with numbers → risk and next step. Aim for under 60 seconds and 75 words.</p>
      <textarea class="close-in" id="closeIn" placeholder="The client should…" aria-label="Your recommendation"></textarea>
      <div class="meter" id="meter"><span>Sentences <b>0</b></span><span>Words <b>0</b></span><span>Time <b>0s</b></span></div>
      <div class="nextrow"><span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to submit</span><button class="btn primary" type="button" id="closeBtn">Submit close</button></div>
      <div id="fbslot"></div>`;
    const ta = $("#closeIn"); ta.focus();
    const upd = () => {
      if (S.answered) return;
      const ss = sentences(ta.value).length, wc = ta.value.trim().split(/\s+/).filter(Boolean).length, sec = Math.round((Date.now() - S.qStart) / 1000);
      $("#meter").innerHTML = `<span class="${ss > 3 ? "over" : ""}">Sentences <b>${ss}</b>/3</span><span class="${wc > 75 ? "over" : ""}">Words <b>${wc}</b></span><span class="${sec > 60 ? "over" : ""}">Time <b>${sec}s</b></span>`;
    };
    ta.addEventListener("input", upd);
    S.meterTimer = setInterval(upd, 1000);
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); answerText(); } });
    $("#closeBtn").addEventListener("click", answerText);
  }
}

function quipFor(ok) { return pick(ok >= .9 ? QUIPS.great : ok >= .7 ? QUIPS.good : ok >= .4 ? QUIPS.meh : QUIPS.bad); }

function showFeedback(ok, body, autoMs) {
  const slot = $("#fbslot");
  const verdicts = ok >= .75 ? ["Nailed it", "Crisp", "Partner-ready", "Clean", "Yes"] : ok >= .4 ? ["Partly there", "Close", "Half credit"] : ["Not quite", "Miss", "Let's fix that"];
  slot.innerHTML = `<div class="fb ${ok >= .75 ? "ok" : "no"}"><span class="verdict">${pick(verdicts)}</span>${body}</div>
    <div class="nextrow" style="margin-top:10px"><button class="btn primary" type="button" id="nextBtn">${S.idx + 1 >= S.queue.length ? "See results" : "Next"} <kbd style="background:transparent;color:inherit;border-color:currentColor">Enter</kbd></button></div>`;
  $("#nextBtn").addEventListener("click", next);
  $("#nextBtn").focus({ preventScroll: true });
  slot.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function answerMCQ(i) {
  if (S.answered) return; S.answered = true;
  const q = current(), ok = i === q.answer;
  const r = record(ok ? 1 : 0);
  $("#stage").querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === q.answer) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
  if (q.sprint) { const me = S; setTimeout(() => { if (S === me) next(); }, ok ? 380 : 1500); return; }
  const slow = r.ms > SKILLS[q.skill].target ? ` <span class="muted">(${(r.ms / 1000).toFixed(0)}s, target ${(SKILLS[q.skill].target / 1000).toFixed(0)}s)</span>` : "";
  showFeedback(ok ? 1 : 0, `<div>${q.explain}</div><span class="quip">+${r.gained} XP${slow}</span>`);
}

function answerNum(v) {
  if (S.answered) return;
  const q = current();
  let x = parseNum(v);
  if (isNaN(x)) { const f = $("#flash") || $("#fbslot"); f.className = f.id === "flash" ? "flash no" : ""; f.innerHTML = `<p class="hint" style="color:var(--bad)">Type a number, like 2.4m or 15%.</p>`; return; }
  S.answered = true;
  // Accept "12" for 12% and money answers given in $M if user typed a bare small number
  const target = q.answer;
  const near = (a) => Math.abs(a - target) <= Math.max(Math.abs(target) * q.tol, q.abs || 0);
  let ok = near(x);
  if (!ok && !/[kmbt%]/i.test(v) && Math.abs(target) >= 1e5) ok = [1e3, 1e6, 1e9].some(m => near(x * m));
  const r = record(ok ? 1 : 0);
  const shown = q.unit === "%" ? (+target.toFixed(2)) + "%" : q.unit === "yrs" ? target.toFixed(1) + " yrs" : q.dollars ? money(target) : fmtNum(target);
  if (q.sprint) {
    const f = $("#flash"); f.className = "flash " + (ok ? "ok" : "no");
    f.textContent = ok ? `✓ ${shown}` : `✗ ${shown}`;
    $("#numIn").disabled = true;
    const me = S; setTimeout(() => { if (S === me) next(); }, ok ? 420 : 1600); return;
  }
  $("#numIn").disabled = true;
  showFeedback(ok ? 1 : 0, `<div>Answer: <b class="num">${shown}</b>. You said <span class="num">${esc(v)}</span>.</div>
    ${q.steps ? `<ul>${q.steps.map(s => `<li class="num" style="font-family:var(--body)">${esc(s)}</li>`).join("")}</ul>` : ""}
    <span class="quip">+${r.gained} XP · ${(r.ms / 1000).toFixed(0)}s (partner pace: ${(SKILLS[q.skill].target / 1000).toFixed(0)}s)</span>`);
}

function answerTap() {
  if (S.answered) return; S.answered = true;
  const q = current();
  const hitCons = new Set(); let fp = 0;
  q.sel.forEach(i => { const c = q.tokens[i].c; if (c >= 0) hitCons.add(c); else fp++; });
  const recall = hitCons.size / q.cons.length;
  const precision = q.sel.size ? (q.sel.size - fp) / q.sel.size : 0;
  const okv = clamp(recall - fp * 0.08, 0, 1);
  const r = record(okv);
  S.items[S.items.length - 1].tap = 1;
  $("#snipe").querySelectorAll(".word").forEach((b, i) => {
    const t = q.tokens[i]; b.disabled = true; b.classList.remove("on");
    if (t.c >= 0) b.classList.add(hitCons.has(t.c) ? "hit" : "miss");
    else if (q.sel.has(i)) b.classList.add("fp");
  });
  $("#lockBtn").disabled = true;
  const why = q.cons.map((c, i) => `<div><b>${esc(c.phrase)}</b><span>${hitCons.has(i) ? "✓" : "<span style='color:var(--bad)'>missed</span>"} · ${esc(c.why)}</span></div>`).join("");
  showFeedback(okv, `<div>Caught <b class="num">${hitCons.size}/${q.cons.length}</b> constraints${fp ? `, with <b class="num">${fp}</b> word${fp > 1 ? "s" : ""} that don't change the framework` : ""}.</div>
    <div class="why">${why}</div><span class="quip">+${r.gained} XP · ${quipFor(okv)}</span>`);
}

function answerText() {
  if (S.answered) return;
  const q = current(), v = $("#closeIn").value;
  if (v.trim().split(/\s+/).length < 8) { $("#meter").insertAdjacentHTML("beforeend", `<span class="over">Write at least one full sentence first.</span>`); return; }
  S.answered = true; clearInterval(S.meterTimer);
  const g = gradeClose(v);
  const r = record(g.score / 5, { score: g.score });
  $("#closeIn").disabled = true;
  const list = g.checks.map(c => `<li><span class="m ${c.ok ? "y" : "n"}">${c.ok ? "✓" : c.partial ? "~" : "✗"}</span><span>${c.label}${c.label.startsWith("Exactly") ? ` <span class="muted">(you wrote ${g.ss.length})</span>` : ""}</span></li>`).join("")
    + (g.hedges.length ? `<li><span class="m n">−1</span><span>Hedging: ${g.hedges.map(h => `"${esc(h)}"`).join(", ")}</span></li>` : "")
    + (g.words > 90 ? `<li><span class="m n">−1</span><span>${g.words} words; a partner stops listening around 75</span></li>` : "");
  showFeedback(g.score / 5, `<div><b class="num">${g.score}/5</b> on the close rubric · ${(r.ms / 1000).toFixed(0)}s · ${g.words} words</div>
    <ul class="rubric">${list}</ul>
    <div class="model"><span class="eyebrow">Model close</span><p>${esc(q.model)}</p></div>
    <span class="quip">+${r.gained} XP · ${quipFor(g.score / 5)}</span>`);
}

/* ============================================================
   Results
   ============================================================ */
async function finish() {
  clearInterval(timerId); clearInterval(S && S.meterTimer);
  if (!S) return;
  const s = S; S = null; screen = "results";
  if (!s.items.length) return renderHome();
  const before = totals().xp;
  const rec = { id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: Date.now(), mode: s.mode, items: s.items, xp: s.xp, bestCombo: s.bestCombo };
  const prev = Store.recs.filter(r => r.mode === s.mode).slice(-1)[0];
  Store.add(rec);
  const acc = s.items.reduce((a, b) => a + b.ok, 0) / s.items.length;
  const avgMs = s.items.reduce((a, b) => a + b.ms, 0) / s.items.length;
  const prevAcc = prev ? prev.items.reduce((a, b) => a + b.ok, 0) / prev.items.length : null;
  const r0 = rankFor(before), r1 = rankFor(before + s.xp);
  const correctN = s.items.filter(i => i.ok >= .75).length;
  const delta = prevAcc == null ? `<span class="muted">first run</span>` : acc - prevAcc >= 0 ? `<span class="delta-up">▲ ${pct(acc - prevAcc)}</span>` : `<span class="delta-dn">▼ ${pct(prevAcc - acc)}</span>`;
  const bySkill = {};
  s.items.forEach(i => { (bySkill[i.s] = bySkill[i.s] || []).push(i); });
  const review = Object.keys(bySkill).map(k => {
    const a = bySkill[k], ac = a.reduce((x, y) => x + y.ok, 0) / a.length, ms = a.reduce((x, y) => x + y.ms, 0) / a.length;
    return `<div><span class="pill ${ac >= .85 ? "mast" : ac >= .6 ? "prog" : "work"}">${pct(ac)}</span><span><b>${SKILLS[k].name}</b> · ${a.length} item${a.length > 1 ? "s" : ""} · avg ${(ms / 1000).toFixed(1)}s vs ${(SKILLS[k].target / 1000).toFixed(0)}s target</span></div>`;
  }).join("");
  const sprintLine = s.sprint ? `<p><b class="num">${correctN}</b> correct in ${s.sprint} seconds${prev ? ` · last time <b class="num">${prev.items.filter(i => i.ok >= .75).length}</b>` : ""}.</p>` : "";
  $("#view").innerHTML = `
  <div class="wrap">
    <section class="card results">
      <span class="eyebrow">${MODES[s.mode].name} · debrief</span>
      <h2 style="font-size:1.8rem">${acc >= .9 ? "Partner-ready." : acc >= .7 ? "Strong work." : acc >= .45 ? "Getting there." : "Tough room."}</h2>
      <p class="muted" style="font-style:italic">${quipFor(acc)}</p>
      ${r1.i > r0.i ? `<div class="rankup">Promoted to ${r1.name}.</div>` : ""}
      ${sprintLine}
      <div class="big">
        <div><b>${pct(acc)}</b><span>accuracy ${delta}</span></div>
        <div><b>${(avgMs / 1000).toFixed(1)}s</b><span>avg per item</span></div>
        <div><b>+${s.xp}</b><span>XP earned</span></div>
        <div><b>×${s.bestCombo}</b><span>best combo</span></div>
      </div>
      <div class="review">${review}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" type="button" id="againBtn">Run it back <kbd style="background:transparent;color:inherit;border-color:currentColor">Enter</kbd></button>
        <button class="btn" type="button" id="homeBtn2">Back to dashboard</button>
      </div>
    </section>
  </div>`;
  $("#againBtn").addEventListener("click", () => startSession(s.mode));
  $("#homeBtn2").addEventListener("click", renderHome);
  $("#againBtn").focus({ preventScroll: true });
  if (acc >= .8 || r1.i > r0.i) confetti();
  scrollTo(0, 0);
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--hl", "--good"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 120 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height * .5, 0), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), r: rnd(0, 6.28), vr: rnd(-.2, .2), w: rnd(6, 11), h: rnd(3, 6), col: pick(cols) }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ============================================================
   Keyboard + boot
   ============================================================ */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (!S) {
    if (tag === "textarea" || tag === "input") return;
    if (e.key === "d" || e.key === "D") { if ($("[data-mode='daily']")) startSession("daily"); }
    if (e.key === "Enter" && $("#againBtn") && document.activeElement !== $("#homeBtn2")) { e.preventDefault(); $("#againBtn").click(); }
    return;
  }
  if (e.key === "Escape") { S.items.length ? finish() : renderHome(); return; }
  const q = current();
  if (!q) return;
  if (S.answered && e.key === "Enter" && $("#nextBtn")) { e.preventDefault(); next(); return; }
  if (!S.answered && q.type === "mcq" && /^[1-9]$/.test(e.key) && tag !== "textarea" && tag !== "input") {
    const i = +e.key - 1; if (i < q.options.length) answerMCQ(i);
  }
  if (!S.answered && q.type === "tap" && e.key === "Enter" && tag !== "button") { e.preventDefault(); answerTap(); }
});
$("#homeBtn").addEventListener("click", () => { if (S && S.items.length) finish(); else renderHome(); });

Store.load();
renderHome();
Store.connect();
</script>
